<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>測試 A</title>
<style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden !important;
        background-color: #ffffff;
        color: #000000;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .box { padding: 16px; }
    .title { font-size: 1.6rem; font-weight: bold; border-bottom: 3px solid #000; padding-bottom: 8px; margin-bottom: 12px; }
    .line { font-size: 1.2rem; font-weight: bold; padding: 10px 0; border-bottom: 1px dashed #000; }
    .marker { font-size: 1.4rem; font-weight: bold; padding: 20px 0; text-align: center; border: 3px solid #000; margin-top: 10px; }
</style>
</head>
<body>
<div class="box">
    <div class="title">測試 A：無隱藏捲軸技巧</div>
    <div class="line">呢頁刻意整到內容高過畫面</div>
    <div class="line">只用 overflow:hidden，冇加任何隱藏捲軸嘅 CSS</div>
    <div class="line">第 1 行</div>
    <div class="line">第 2 行</div>
    <div class="line">第 3 行</div>
    <div class="line">第 4 行</div>
    <div class="line">第 5 行</div>
    <div class="line">第 6 行</div>
    <div class="line">第 7 行</div>
    <div class="line">第 8 行</div>
    <div class="line">第 9 行</div>
    <div class="line">第 10 行</div>
    <div class="line">第 11 行</div>
    <div class="line">第 12 行</div>
    <div class="marker">如果你郁到隻手指刷到見到呢個框，代表個頁面捲動咗</div>
</div>
</body>
</html>
