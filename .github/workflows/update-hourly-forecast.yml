name: Update hourly weather forecast cache

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-hourly-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Open-Meteo hourly forecast (server-side, avoids Kindle browser CORS/TLS limitations)
        run: python3 scripts/fetch_hourly_forecast.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hourly_forecast.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update hourly weather forecast cache"
            git push
          else
            echo "No change in hourly forecast data, skipping commit."
          fi
