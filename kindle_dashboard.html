<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle 資訊面板</title>
    <style>
        /* ===== 針對舊版 Kindle 最安全的佈局設定 ===== */
        :root {
            --fg: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        /* 隱藏瀏覽器上方選單列留下的空間 (若有) */
        .dashboard {
            width: 100%;
            height: 100%;
            position: relative; /* 作為絕對定位的基準 */
        }

        /* ===== 區塊絕對定位切割 ===== */
        
        /* 1. 上方區塊：高度 25% */
        .row-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25%;
            border-bottom: 3px solid var(--fg);
        }
        
        .box-time {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            border-right: 3px solid var(--fg);
            text-align: center;
            padding-top: 5%;
        }
        
        .box-weather {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            text-align: center;
            padding-top: 3%;
        }

        /* 2. 中間區塊：高度 50% */
        .row-mid {
            position: absolute;
            top: 25%;
            left: 0;
            width: 100%;
            height: 50%;
            border-bottom: 3px solid var(--fg);
        }
        
        .box-bus-kmb {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            border-right: 3px solid var(--fg);
            text-align: center;
            padding-top: 10px;
        }
        
        .box-bus-shuttle {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
            text-align: center;
            padding-top: 10px;
        }

        /* 3. 下方區塊：高度 25% */
        .row-bottom {
            position: absolute;
            top: 75%;
            left: 0;
            width: 100%;
            height: 25%;
        }
        
        /* 預報 4 天，每格 25% 寬 */
        .f-day {
            position: absolute;
            top: 0;
            height: 100%;
            width: 25%;
            border-right: 1px dashed var(--fg);
            text-align: center;
            padding-top: 5px;
        }
        .f-day-1 { left: 0; }
        .f-day-2 { left: 25%; }
        .f-day-3 { left: 50%; }
        .f-day-4 { left: 75%; border-right: none; }


        /* ===== 內部文字排版 ===== */
        .time-main { font-size: 4.5rem; font-weight: bold; line-height: 1.1; }
        .date-main { font-size: 1.2rem; font-weight: bold; }
        
        .w-icon { width: 75px; height: 75px; filter: grayscale(100%); margin-bottom: 5px; }
        .w-temp { font-size: 2.8rem; font-weight: bold; line-height: 1; }
        
        .bus-title { font-size: 1.6rem; font-weight: bold; border-bottom: 2px solid var(--fg); padding-bottom: 5px; margin: 0 10px 5px 10px;}
        .bus-route { font-size: 1.1rem; font-weight: bold; }
        .bus-tag { display: inline-block; font-size: 0.9rem; border: 1px solid var(--fg); border-radius: 10px; padding: 2px 6px; margin: 5px 0;}
        
        /* 使用 float 或 margin 推動元素到底部在絕對定位中較難，改用 padding 固定位置 */
        .eta-main-wrapper { margin-top: 20px; }
        .eta-main { font-size: 3.5rem; font-weight: bold; line-height: 1.1; }
        .eta-sub { font-size: 1.2rem; font-weight: bold; }
        .eta-sub-small { font-size: 1rem; }
        .eta-update { font-size: 0.8rem; margin-top: 15px; }

        .f-date { font-size: 1.1rem; font-weight: bold; line-height: 1.2; }
        .f-week { font-size: 1rem; font-weight: bold; line-height: 1.2; }
        .f-icon { width: 45px; height: 45px; filter: grayscale(100%); margin: 3px 0; }
        .f-temp { font-size: 1.1rem; font-weight: bold; }
        .f-rh { font-size: 0.9rem; font-weight: bold; }

    </style>
</head>
<body>

<div class="dashboard">

    <!-- 上方 -->
    <div class="row-top">
        <div class="box-time">
            <div class="time-main" id="local-time">--:--</div>
            <div class="date-main" id="local-date">載入中...</div>
        </div>
        <div class="box-weather" id="current-weather">
            載入天氣中...
        </div>
    </div>

    <!-- 中間 -->
    <div class="row-mid">
        <div class="box-bus-kmb">
            <div class="bus-title">九巴 234B</div>
            <div class="bus-route">油柑頭 ➔ 荃灣西</div>
            <div class="eta-main-wrapper" id="kmb-container">
                載入中...
            </div>
        </div>
        
        <div class="box-bus-shuttle">
            <div class="bus-title">恆麗園村巴</div>
            <div class="bus-route">往 荃灣</div>
            <div class="bus-tag" id="shuttle-type">載入中</div>
            <div class="eta-main-wrapper" id="shuttle-container">
                計算中...
            </div>
        </div>
    </div>

    <!-- 下方 -->
    <div class="row-bottom" id="forecast-container">
        <!-- 預報位 -->
        載入預報中...
    </div>

</div>

<script>
    // ===== 全局變數 =====
    var isPublicHoliday = false;
    var currentNetTimeMs = 0; // 儲存網路時間 (毫秒)
    var timeSyncTimer = null;

    // 恆麗園村巴資料
    var shuttleSchedule = {
        monFri: ["06:30", "06:55", "07:10", "07:25", "07:35", "07:50", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "10:00", "10:40", "11:20", "12:00", "12:30", "13:00", "13:40", "14:20", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:50", "20:15", "20:45", "21:15", "21:45", "22:15", "22:45"],
        sat: ["06:30", "06:55", "07:10", "07:25", "07:35", "07:50", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "10:00", "10:20", "10:40", "11:20", "12:00", "12:30", "13:00", "13:40", "14:20", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:50", "20:15", "20:45", "21:15", "21:45", "22:15", "22:45"],
        sun: ["08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:05", "12:40", "13:15", "13:50", "14:25", "15:00", "15:35", "16:10", "16:45", "17:20", "17:55", "18:30", "18:55", "19:20", "19:45", "20:10", "20:35", "21:00"]
    };

    // 格式化數字 (補0)
    function pad(n) { return n < 10 ? '0' + n : n; }

    // ===== 自建 AJAX 請求函數 (相容 ES5) =====
    function fetchJSON(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        callback(null, data);
                    } catch (e) { callback(e, null); }
                } else {
                    callback(new Error("Request Failed"), null);
                }
            }
        };
        xhr.send();
    }

    // ===== 解決時間不準：從網路抓真實香港時間 =====
    function syncNetworkTime() {
        // 使用 World Time API 獲取香港時間
        fetchJSON('http://worldtimeapi.org/api/timezone/Asia/Hong_Kong', function(err, data) {
            if (!err && data && data.unixtime) {
                // 將 unix time 轉為毫秒，並加上網路延遲的緩衝
                currentNetTimeMs = (data.unixtime * 1000) + 500; 
                
                // 開始內部計時器，每秒將 currentNetTimeMs 加 1000
                if(timeSyncTimer) clearInterval(timeSyncTimer);
                timeSyncTimer = setInterval(function(){
                    currentNetTimeMs += 1000;
                    renderClock(); // 每秒重繪時鐘
                }, 1000);
                
                // 拿到正確時間後才執行其他更新，確保它們抓到的 now 是準確的
                checkPublicHoliday();
                updateKMB();
                updateShuttleBus();
                updateWeather();
            } else {
                // 如果抓不到網路時間 (可能 API 倒了)，只能回退到使用系統時間
                document.getElementById('local-date').innerText = "時間同步失敗";
                currentNetTimeMs = new Date().getTime();
                setInterval(function(){
                    currentNetTimeMs += 1000;
                    renderClock();
                }, 1000);
            }
        });
    }

    // ===== 顯示時鐘 =====
    function renderClock() {
        if(currentNetTimeMs === 0) return;

        // 將網路抓取的毫秒數，強制轉換為香港時區的 Date 物件 (Hack 寫法)
        // 因為 new Date(ms) 會根據瀏覽器本地時區顯示，如果 Kindle 錯區，顯示還是會錯。
        // 所以我們要用 UTC 方法來硬算香港時間 (+8)
        var d = new Date(currentNetTimeMs);
        var utcMs = d.getTime() + (d.getTimezoneOffset() * 60000); // 轉回純 UTC 毫秒
        var hkMs = utcMs + (3600000 * 8); // 加上香港 8 小時
        var hkDate = new Date(hkMs);

        var h = pad(hkDate.getHours());
        var m = pad(hkDate.getMinutes());
        var mon = hkDate.getMonth() + 1;
        var day = hkDate.getDate();
        var weekMap = ['日','一','二','三','四','五','六'];
        var week = weekMap[hkDate.getDay()];

        document.getElementById('local-time').innerText = h + ':' + m;
        document.getElementById('local-date').innerText = mon + '/' + day + ' (' + week + ')' + (isPublicHoliday ? ' 紅日' : '');
    }

    // 獲取當前的準確香港 Date 物件，供巴士計算 ETA 用
    function getAccurateHKDate() {
        if(currentNetTimeMs === 0) return new Date();
        var d = new Date(currentNetTimeMs);
        var utcMs = d.getTime() + (d.getTimezoneOffset() * 60000); 
        var hkMs = utcMs + (3600000 * 8); 
        return new Date(hkMs);
    }


    // ===== 政府 1823 API: 檢查公眾假期 =====
    function checkPublicHoliday() {
        var hkDate = getAccurateHKDate();
        var y = hkDate.getFullYear();
        var m = pad(hkDate.getMonth() + 1);
        var d = pad(hkDate.getDate());
        var todayStr = String(y) + String(m) + String(d);

        // 為求穩定，移除 LocalStorage 緩存，每次啟動查一次即可
        fetchJSON('https://www.1823.gov.hk/common/ical/tc.json', function(err, data) {
            if (!err && data && data.vcalendar && data.vcalendar[0].vevent) {
                var holidays = [];
                var events = data.vcalendar[0].vevent;
                for(var i=0; i<events.length; i++) {
                    var e = events[i];
                    if (e.dtstart) {
                        var dt = Array.isArray(e.dtstart) ? (typeof e.dtstart[0] === 'string' ? e.dtstart[0] : e.dtstart[0].value) : e.dtstart;
                        if(dt) holidays.push(dt);
                    }
                }
                isPublicHoliday = (holidays.indexOf(todayStr) !== -1);
            }
            // 檢查完假期再更新一次村巴時間表
            updateShuttleBus();
            renderClock();
        });
    }

    // ===== 更新村巴 =====
    function parseTimeToMins(timeStr) {
        var parts = timeStr.split(':');
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function updateShuttleBus() {
        var hkDate = getAccurateHKDate();
        var currentMins = hkDate.getHours() * 60 + hkDate.getMinutes();
        var dayOfWeek = hkDate.getDay(); 

        var activeSchedule = [];
        var scheduleName = "";

        if (dayOfWeek === 0 || isPublicHoliday) {
            activeSchedule = shuttleSchedule.sun;
            scheduleName = "紅日班次";
        } else if (dayOfWeek === 6) {
            activeSchedule = shuttleSchedule.sat;
            scheduleName = "星期六班次";
        } else {
            activeSchedule = shuttleSchedule.monFri;
            scheduleName = "平日班次";
        }

        document.getElementById('shuttle-type').innerText = scheduleName;

        var upcoming = [];
        for(var i=0; i<activeSchedule.length; i++) {
            if(parseTimeToMins(activeSchedule[i]) >= currentMins) {
                upcoming.push(activeSchedule[i]);
            }
        }
        
        var updateTimeStr = pad(hkDate.getHours()) + ':' + pad(hkDate.getMinutes());

        if (upcoming.length > 0) {
            var nextBus = upcoming[0];
            var diffMins = parseTimeToMins(nextBus) - currentMins;
            
            var html = '<div class="eta-main">' + (diffMins === 0 ? '即將開出' : diffMins + ' 分鐘') + '</div>';
            html += '<div class="eta-sub">本班: ' + nextBus + '</div>';
            
            if (upcoming.length > 1) {
                var nextBuses = upcoming.slice(1, 3).join(', ');
                html += '<div class="eta-sub eta-sub-small">隨後: ' + nextBuses + '</div>';
            }
            html += '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
            document.getElementById('shuttle-container').innerHTML = html;
        } else {
            document.getElementById('shuttle-container').innerHTML = '<div class="eta-main" style="font-size: 2rem;">今日已完結</div><div class="eta-update">更新: ' + updateTimeStr + '</div>';
        }
    }

    // ===== 更新 234B (硬編碼車站 ID，極大降低崩潰率) =====
    function updateKMB() {
        var route = '234B';
        var stopId = '277DEAAFCFFCD64C'; // 234B 油柑頭 往 荃灣西
        var dir = 'O'; 

        var url = 'https://data.etabus.gov.hk/v1/transport/kmb/eta/' + stopId + '/' + route + '/1';
        
        fetchJSON(url, function(err, etaData) {
            var hkDate = getAccurateHKDate();
            var updateTimeStr = pad(hkDate.getHours()) + ':' + pad(hkDate.getMinutes());

            if (err || !etaData || !etaData.data) {
                document.getElementById('kmb-container').innerHTML = "<div class='eta-sub'>API 無回應</div><div class='eta-update'>" + updateTimeStr + "</div>";
                return;
            }
            
            var etas = [];
            for(var i=0; i<etaData.data.length; i++) {
                var d = etaData.data[i];
                if (d.dir === dir && d.eta !== null) {
                    var etaTime = new Date(d.eta).getTime();
                    // 因為 KMB 回傳的是 ISO 8601，系統會自動轉本地。
                    // 為了避免本地錯誤，我們把 KMB 的 ISO 字串硬拆來算 (最安全的作法)
                    var etaStringStr = String(d.eta); // "2023-10-24T18:30:00+08:00"
                    if(etaStringStr.indexOf('T') !== -1) {
                        var tPart = etaStringStr.split('T')[1].substring(0,5); // "18:30"
                        var etaMins = parseTimeToMins(tPart);
                        var nowMins = hkDate.getHours() * 60 + hkDate.getMinutes();
                        
                        var diff = etaMins - nowMins;
                        // 處理跨日問題
                        if(diff < -500) diff += 1440; 
                        if(diff >= 0) {
                            etas.push(diff);
                        }
                    }
                }
            }
            
            etas.sort(function(a, b){ return a - b; });
            
            if (etas.length > 0) {
                var html = '<div class="eta-main">' + (etas[0] === 0 ? '即將抵達' : etas[0] + ' 分鐘') + '</div>';
                if (etas.length > 1) {
                    var subEtas = [];
                    for(var j=1; j<Math.min(3, etas.length); j++) { subEtas.push(etas[j] + '分'); }
                    html += '<div class="eta-sub eta-sub-small">隨後: ' + subEtas.join(', ') + '</div>';
                }
                html += '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
                document.getElementById('kmb-container').innerHTML = html;
            } else {
                document.getElementById('kmb-container').innerHTML = '<div class="eta-main" style="font-size: 2.2rem;">暫無班次</div><div class="eta-update">更新: ' + updateTimeStr + '</div>';
            }
        });
    }

    // ===== 更新天氣 =====
    function updateWeather() {
        // 1. 現在天氣
        fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc', function(err, curData) {
            if(!err && curData) {
                var temp = '--';
                if(curData.temperature && curData.temperature.data) {
                    temp = curData.temperature.data[1] ? curData.temperature.data[1].value : curData.temperature.data[0].value;
                }
                var icon = curData.icon ? curData.icon[0] : '50';
                
                var html = '<img src="https://www.hko.gov.hk/images/wxicon/pic' + icon + '.png" class="w-icon">';
                html += '<div class="w-temp">' + temp + '°C</div>';
                document.getElementById('current-weather').innerHTML = html;
            }
        });

        // 2. 四日預報
        fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc', function(err, fndData) {
            if(!err && fndData && fndData.weatherForecast) {
                var html = '';
                var maxDays = Math.min(4, fndData.weatherForecast.length);
                for(var i=0; i<maxDays; i++) {
                    var day = fndData.weatherForecast[i];
                    var dateStr = day.forecastDate.substring(4,6) + '/' + day.forecastDate.substring(6,8);
                    
                    html += '<div class="f-day f-day-' + (i+1) + '">';
                    html += '<div class="f-date">' + dateStr + '</div>';
                    html += '<div class="f-week">(' + day.week + ')</div>';
                    html += '<img src="https://www.hko.gov.hk/images/wxicon/pic' + day.ForecastIcon + '.png" class="f-icon">';
                    html += '<div class="f-temp">' + day.forecastMintemp.value + '°- ' + day.forecastMaxtemp.value + '°</div>';
                    html += '<div class="f-rh">' + day.forecastMinrh.value + '%-' + day.forecastMaxrh.value + '%</div>';
                    html += '</div>';
                }
                document.getElementById('forecast-container').innerHTML = html;
            }
        });
    }

    // ===== 系統啟動 =====
    window.onload = function() {
        // 第一步：先抓取真實香港時間。抓到了就會連帶觸發其他更新。
        syncNetworkTime();

        // 設立定期更新排程
        // 巴士每 1 分鐘更新
        setInterval(function() {
            updateKMB();
            updateShuttleBus();
        }, 60000);
        
        // 天氣每 15 分鐘更新
        setInterval(function() {
            updateWeather();
        }, 900000);
        
        // 網路時間每 1 小時重新校對一次，避免計時器飄移
        setInterval(function() {
            syncNetworkTime();
        }, 3600000);
    };

</script>
</body>
</html>
