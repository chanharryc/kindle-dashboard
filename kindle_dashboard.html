<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle 資訊面板</title>
    <style>
        /* ===== 終極防捲軸 CSS ===== */
        html, body {
            width: 100%;
            height: 100%; /* 捨棄 vh，改回最穩定的 100% */
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -ms-overflow-style: none; /* IE/舊版 Edge */
            scrollbar-width: none; /* Firefox */
        }
        /* 就算個別瀏覽器引擎喺極少數情況（如子像素捨入誤差）仍判定內容輕微溢出，
           都強制隱藏 WebKit 捲軸本身嘅視覺元素（唔影響 overflow:hidden 已經停用嘅捲動功能） */
        html::-webkit-scrollbar, body::-webkit-scrollbar {
            width: 0 !important;
            height: 0 !important;
            display: none !important;
        }

        * {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .dashboard {
            width: 100%;
            height: 100%;
            display: block; /* 改變這裡：不使用全局大表格，避免欄位被鎖死 */
        }

        /* ===== 行設定 (每一行獨立成一個 Table) ===== */
        .row { 
            display: table; 
            width: 100%;
            table-layout: fixed;
        }
        
        /* 刻意將總高度壓縮至 94%，剩餘 6% 空間作為緩衝，絕對消滅捲軸 */
        .row-top { height: 24%; }
        .row-bus { height: 34%; }
        .row-hourly { height: 18%; } 
        .row-bottom { height: 18%; }

        /* ===== 列與儲存格設定 ===== */
        .cell {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
            border-bottom: 4px solid #000000;
        }

        .row-bottom .cell { border-bottom: none; }
        /* 兩個天氣預報列（未來6小時 / 未來4日）視覺上歸為同一組，改用虛線分隔，
           與「現況」區塊之間的實線區隔開 */
        .row-hourly .cell { border-bottom: 2px dashed #000000; }
        .border-right { border-right: 4px solid #000000; }
        .border-right-dashed { border-right: 2px dashed #000000; }

        /* ===== 內部佈局微調 ===== */
        .bus-container { position: relative; height: 100%; }
        .bus-top { position: absolute; top: 5px; left: 0; width: 100%; text-align: center; }
        .bus-mid { position: absolute; top: 50%; left: 0; width: 100%; -webkit-transform: translateY(-50%); transform: translateY(-50%); text-align: center; }
        .bus-bot { position: absolute; bottom: 5px; left: 0; width: 100%; text-align: center; }

        /* ===== 內部文字與 SVG 排版：盡量放大內容，減少留白 ===== */
        .time-main { font-size: 5rem; font-weight: bold; line-height: 1; margin-bottom: 8px; }
        .date-main { font-size: 1.4rem; font-weight: bold; }

        .w-icon { width: 100px; height: 100px; display: inline-block; }
        .w-temp { font-size: 3.2rem; font-weight: bold; line-height: 1; display: block;}
        .w-desc { font-size: 1.15rem; font-weight: bold; margin-top: 8px; letter-spacing: 0.5px; }

        /* 巴士圖示 + 標題文字：用 table-cell 做對齊，避免 vertical-align 數值在不同瀏覽器計法不一而錯位 */
        .bus-icon-row { display: table; margin: 0 auto; }
        .bus-icon-cell, .bus-title-cell { display: table-cell; vertical-align: middle; }
        .bus-icon { width: 28px; height: 28px; display: block; position: relative; top: -3px; }
        .bus-title-cell { padding-left: 6px; white-space: nowrap; }
        .bus-title { font-size: 1.7rem; font-weight: bold; border-bottom: 2px solid #000000; padding-bottom: 4px; margin: 0 10px 8px 10px;}
        .bus-route { font-size: 1.2rem; font-weight: bold; }
        .bus-tag { display: inline-block; font-size: 1rem; border: 1px solid #000000; border-radius: 8px; padding: 1px 8px; margin-top: 4px;}
        .eta-main { font-size: 3.2rem; font-weight: bold; line-height: 1; margin-bottom: 6px; }
        .eta-sub { font-size: 1.2rem; font-weight: bold; line-height: 1.2; }
        .eta-sub-small { font-size: 1.05rem; }
        .eta-update { font-size: 0.85rem; color: #333; }

        /* 度數符號：自行繪製小圓圈，避免字體本身的「°」字符偏高偏輕，導致置中後視覺上偏左 */
        .deg { display: inline-block; width: 0.32em; height: 0.32em; border: 0.075em solid #000000; border-radius: 50%; vertical-align: 0.55em; margin: 0 0.06em; }

        /* 每小時天氣：盡量放大內容，減少留白 */
        .h-time { font-size: 1.25rem; font-weight: bold; margin-bottom: 6px; }
        .h-icon { width: 72px; height: 72px; display: inline-block; }
        .h-temp { font-size: 1.5rem; font-weight: bold; margin-top: 6px; }

        .f-date { font-size: 1.3rem; font-weight: bold; line-height: 1.2; }
        .f-icon { width: 62px; height: 62px; display: inline-block; margin: 5px 0; }
        .f-temp { font-size: 1.3rem; font-weight: bold; text-align: center; }
        .f-rh { font-size: 1rem; font-weight: bold; margin-top: 4px; text-align: center; }

        .kmb-error { font-size: 1.3rem; font-weight: bold; }

    </style>
</head>
<body>

<div class="dashboard">

    <!-- 1. 上方 -->
    <div class="row row-top">
        <div class="cell border-right" style="width: 50%;">
            <div class="time-main" id="local-time">--:--</div>
            <div class="date-main" id="local-date">載入中...</div>
        </div>
        <div class="cell" style="width: 50%;" id="current-weather">
            載入天氣中...
        </div>
    </div>

    <!-- 2. 中間 -->
    <div class="row row-bus">
        <div class="cell border-right" style="width: 50%; height: 100%;">
            <div class="bus-container">
                <div class="bus-top">
                    <div class="bus-title"><span class="bus-icon-row"><span class="bus-icon-cell"><span class="bus-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="7" y1="16" x2="7" y2="19"></line><line x1="17" y1="16" x2="17" y2="19"></line><circle cx="7" cy="19" r="1.3" fill="#000000"></circle><circle cx="17" cy="19" r="1.3" fill="#000000"></circle></svg></span></span><span class="bus-title-cell">九巴 234B</span></span></div>
                    <div class="bus-route">油柑頭 ➔ 荃灣西</div>
                </div>
                <div class="bus-mid" id="kmb-mid">載入中...</div>
                <div class="bus-bot" id="kmb-bot"><div class="eta-update">--:--</div></div>
            </div>
        </div>
        
        <div class="cell" style="width: 50%; height: 100%;">
            <div class="bus-container">
                <div class="bus-top">
                    <div class="bus-title"><span class="bus-icon-row"><span class="bus-icon-cell"><span class="bus-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="7" y1="16" x2="7" y2="19"></line><line x1="17" y1="16" x2="17" y2="19"></line><circle cx="7" cy="19" r="1.3" fill="#000000"></circle><circle cx="17" cy="19" r="1.3" fill="#000000"></circle></svg></span></span><span class="bus-title-cell">恆麗園村巴</span></span></div>
                    <div class="bus-route">往 荃灣</div>
                    <div id="shuttle-tag-container"></div>
                </div>
                <div class="bus-mid" id="shuttle-mid">計算中...</div>
                <div class="bus-bot" id="shuttle-bot"><div class="eta-update">--:--</div></div>
            </div>
        </div>
    </div>

    <!-- 3. 未來 6 小時天氣 -->
    <div class="row row-hourly" id="hourly-container">
        <div class="cell border-right-dashed" style="width: 16.6%;" id="h-1">載入中...</div>
        <div class="cell border-right-dashed" style="width: 16.6%;" id="h-2"></div>
        <div class="cell border-right-dashed" style="width: 16.6%;" id="h-3"></div>
        <div class="cell border-right-dashed" style="width: 16.6%;" id="h-4"></div>
        <div class="cell border-right-dashed" style="width: 16.6%;" id="h-5"></div>
        <div class="cell" style="width: 17%;" id="h-6"></div>
    </div>

    <!-- 4. 四日預報 -->
    <div class="row row-bottom" id="forecast-container">
        <div class="cell border-right-dashed" style="width: 25%;" id="f-1">載入預報中...</div>
        <div class="cell border-right-dashed" style="width: 25%;" id="f-2"></div>
        <div class="cell border-right-dashed" style="width: 25%;" id="f-3"></div>
        <div class="cell" style="width: 25%;" id="f-4"></div>
    </div>

</div>

<script>
    var isPublicHoliday = false;
    var currentNetTimeMs = 0; 
    var timeSyncTimer = null;
    var currentTempC = null;
    var currentIconId = null;
    var weekAbbrEN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    var shuttleSchedule = {
        monFri: ["06:30", "06:55", "07:10", "07:25", "07:35", "07:50", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "10:00", "10:40", "11:20", "12:00", "12:30", "13:00", "13:40", "14:20", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:50", "20:15", "20:45", "21:15", "21:45", "22:15", "22:45"],
        sat: ["06:30", "06:55", "07:10", "07:25", "07:35", "07:50", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "10:00", "10:20", "10:40", "11:20", "12:00", "12:30", "13:00", "13:40", "14:20", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:50", "20:15", "20:45", "21:15", "21:45", "22:15", "22:45"],
        sun: ["08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:05", "12:40", "13:15", "13:50", "14:25", "15:00", "15:35", "16:10", "16:45", "17:20", "17:55", "18:30", "18:55", "19:20", "19:45", "20:10", "20:35", "21:00"]
    };

    function pad(n) { return n < 10 ? '0' + n : n; }

    function fetchJSON(url, callback) {
        var xhr = new XMLHttpRequest();
        var done = false;
        function finish(err, data) {
            if (done) return;
            done = true;
            callback(err, data);
        }
        xhr.open('GET', url, true);
        xhr.timeout = 10000; // 避免舊版瀏覽器連線異常時無限「載入中」
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try { finish(null, JSON.parse(xhr.responseText)); }
                    catch (e) { finish(e, null); }
                } else {
                    finish(new Error("Failed"), null);
                }
            }
        };
        xhr.onerror = function() { finish(new Error("Network Error"), null); };
        xhr.ontimeout = function() { finish(new Error("Timeout"), null); };
        xhr.send();
    }

    /* ===== 天氣圖示：還原返用戶舊版 dashboard 嗰種簡約粗線畫風 =====
       （分類判斷邏輯本身唔變——日/夜區分、降雨/驟雨3級等全部保留，
       只係將個別圖示嘅實際線條畫法還原做舊版嗰種簡單粗身風格：
       stroke-width 2.5、太陽8條光芒、雲用返 Feather 風格嘅雲朵，
       雨用直/斜線表達，雷暴用 polyline 閃電） */
    var CLOUD = 'M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z';
    var CLOUD_EL = '<path d="' + CLOUD + '" fill="#ffffff"></path>';
    // 「局部多雲」嘅雲維持原本大細，向下移少少，等太陽/月亮個「地平線」
    // 卡喺雲頂附近，太陽/月亮就淨係露出上半（一半），唔會出界都唔會
    // 露太多；同時落移幅度控制喺 3.5（原本 5 太多，令雲最底條線嘅
    // 筆畫粗度撞到 viewBox 底邊被裁走一截，而家留返足夠邊位）
    var CLOUD_LOW_EL = '<g transform="translate(1,3.5)"><path d="' + CLOUD + '" fill="#ffffff"></path></g>';
    // 舊版落雨/雷暴用嘅係另一個較「開口」嘅雲形狀，同上面嗰個唔同
    var RAIN_CLOUD = 'M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25';
    var RAIN_CLOUD_EL = '<path d="' + RAIN_CLOUD + '" fill="#ffffff"></path>';

    function line(x1, y1, x2, y2) {
        return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"></line>';
    }
    // 驟雨專用虛線（同持續性降雨嘅實線區分開），點與點之間留大空間
    function dashLine(x1, y1, x2, y2) {
        return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke-dasharray="1.2,3.6"></line>';
    }

    var ICON_SVG = {
        'sun-day': '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>',

        'moon-night': '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>',

        // 太陽/月亮嘅「地平線」啱啱好喺雲頂（y=10）附近，準確露出上半，
        // 唔會被裁走亦唔會露過多。太陽 8 條射線入面，露出嗰 5 條
        // （上、左上、右上、左、右）全部對準返以圓心 (10,10) 計算嘅
        // 正確角度——之前左/右嗰兩條被錯誤畫成斜向，而家改返做水平，
        // 先同其餘 3 條組成對稱嘅扇形
        'partly-day': '<path d="M4 10A6 6 0 0 1 16 10"></path><line x1="10" y1="3" x2="10" y2="1.5"></line><line x1="5.05" y1="5.05" x2="3.99" y2="3.99"></line><line x1="14.95" y1="5.05" x2="16.01" y2="3.99"></line><line x1="3" y1="10" x2="1.5" y2="10"></line><line x1="17" y1="10" x2="18.5" y2="10"></line>' + CLOUD_LOW_EL,

        'partly-night': '<g transform="translate(3.39,-1.55) scale(0.55)"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></g>' + CLOUD_LOW_EL,

        'cloudy': CLOUD_EL,

        'overcast': '<circle cx="4.5" cy="11" r="2.3"></circle>' + CLOUD_EL,

        'fog': '<path d="M3 8c2 -1.6 4 1.6 6 0s4 -1.6 6 0s4 1.6 6 0"></path><path d="M3 13c2 -1.6 4 1.6 6 0s4 -1.6 6 0s4 1.6 6 0"></path><path d="M3 18c2 -1.6 4 1.6 6 0s4 -1.6 6 0s4 1.6 6 0"></path>',

        // 降雨分 3 級：直線數量 + 長度雙重編碼，同舊版一致嘅表達方式
        'rain-light': RAIN_CLOUD_EL + line(14, 15, 14, 19) + line(10, 17, 10, 19),

        'rain-mod': RAIN_CLOUD_EL + line(14, 14, 14, 20) + line(10, 15, 10, 20),

        'rain-heavy': RAIN_CLOUD_EL + line(16, 13, 16, 21) + line(8, 13, 8, 21) + line(12, 15, 12, 23),

        // 驟雨3級：x 位置、高低錯落（立體感）完全跟返「降雨‧持續性」嗰3級
        // 一樣嘅擺位，加返同一個斜率令全部線打斜之餘仍然互相平行；
        // 用虛線（而唔係實線）同持續性降雨區分開，方便一眼分辨兩類。
        // showers-heavy 中間嗰條線係沿住線本身嘅斜向位移嚟做高低錯落
        // （唔係淨係垂直移），先可以保持3條線之間嘅垂直間距完全相等。
        'showers-light': RAIN_CLOUD_EL + dashLine(14, 15, 12.67, 19) + dashLine(10, 17, 9.33, 19),

        'showers-mod': RAIN_CLOUD_EL + dashLine(14, 14, 12, 20) + dashLine(10, 15, 8.33, 20),

        'showers-heavy': RAIN_CLOUD_EL + dashLine(16, 13, 13.33, 21) + dashLine(8, 13, 5.33, 21) + dashLine(11.33, 15, 8.66, 23),

        'thunder': RAIN_CLOUD_EL + '<polyline points="13 11 9 17 15 17 11 23"></polyline>',

        'snow': RAIN_CLOUD_EL + line(11.5, 16, 14, 19) + line(14, 16, 11.5, 19) + line(7.5, 17, 10, 20) + line(10, 17, 7.5, 20),

        'windy': '<path d="M2 8h13.5a2.5 2.5 0 1 0 -2.4 -3.2"></path><path d="M2 12.5h17a2.8 2.8 0 1 1 -2.7 3.6"></path><path d="M2 17h11a2 2 0 1 1 -1.9 2.6"></path>',

        'hot': '<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z" fill="#000000" stroke="none"></path>',

        'cold': '<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"></path>',

        'cyclone': '<path d="M12 2.2a9.8 9.8 0 1 0 9.8 9.8"></path><path d="M12 6a6 6 0 1 0 6 6"></path><path d="M12 9.8a2.2 2.2 0 1 0 2.2 2.2"></path>'
    };

    function renderIconCategory(category) {
        var S = '<svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">';
        var E = '</svg>';
        return S + (ICON_SVG[category] || ICON_SVG['cloudy']) + E;
    }

    /* HKO 天氣圖示代碼 → 分類（日/夜分開處理，避免夜間「天晴」誤顯示做雷暴等錯配問題） */
    function hkoCodeToCategory(iconNumberStr) {
        var n = parseInt(iconNumberStr, 10);
        if (n === 50 || n === 51 || n === 81) return 'sun-day';
        if (n >= 70 && n <= 75) return 'moon-night';
        if (n === 52 || n === 53 || n === 54) return 'partly-day';
        if (n === 76 || n === 77) return 'partly-night';
        if (n === 60) return 'cloudy';
        if (n === 61) return 'overcast';
        if (n === 62) return 'rain-light';
        if (n === 63) return 'rain-mod';
        if (n === 64) return 'rain-heavy';
        if (n === 82) return 'showers-mod'; // HKO 只有單一「驟雨」代碼，冇分級，取中間值代表
        if (n === 65) return 'thunder';
        if (n === 80) return 'windy';
        if (n === 83 || n === 84 || n === 85) return 'snow';
        if (n === 90) return 'hot';
        if (n === 91) return 'cold';
        if (n === 92) return 'cyclone';
        return 'cloudy';
    }

    function getSvgIcon(iconNumberStr) {
        return renderIconCategory(hkoCodeToCategory(iconNumberStr));
    }

    /* WMO weathercode（Open-Meteo 逐小時預報用）→ 分類 */
    function wmoCodeToCategory(code, isDay) {
        var n = parseInt(code, 10);
        var day = isDay !== 0;
        if (n === 0 || n === 1) return day ? 'sun-day' : 'moon-night';
        if (n === 2) return day ? 'partly-day' : 'partly-night';
        if (n === 3) return 'overcast';
        if (n === 45 || n === 48) return 'fog';
        // 毛毛雨 (drizzle)：51 輕、53 中、55 密 —— 對應輕/中兩級（密毛毛雨仍然唔算「大雨」）
        if (n === 51 || n === 56) return 'rain-light';
        if (n === 53 || n === 55 || n === 57) return 'rain-mod';
        if (n === 61) return 'rain-light';
        if (n === 63) return 'rain-mod';
        if (n === 65 || n === 67) return 'rain-heavy';
        if (n === 71 || n === 73 || n === 75 || n === 77 || n === 85 || n === 86) return 'snow';
        // 驟雨 (rain showers)：80 輕、81 中、82 猛烈 —— WMO 原生已分 3 級，直接對應
        if (n === 80) return 'showers-light';
        if (n === 81) return 'showers-mod';
        if (n === 82) return 'showers-heavy';
        if (n === 95 || n === 96 || n === 99) return 'thunder';
        return 'cloudy';
    }

    function getWmoSvgIcon(code, isDay) {
        return renderIconCategory(wmoCodeToCategory(code, isDay));
    }

    function getWeatherDesc(iconNumberStr) {
        var map = {
            50: '晴朗', 51: '大致天晴', 52: '短暫陽光有驟雨', 53: '部分時間有陽光',
            54: '部分時間有陽光有驟雨', 60: '多雲', 61: '密雲', 62: '微雨', 63: '有雨',
            64: '大雨', 65: '雷暴', 70: '天晴', 71: '天晴', 72: '天晴', 73: '天晴',
            74: '天晴', 75: '天晴', 76: '大致多雲', 77: '大致多雲', 80: '大風',
            81: '乾燥', 82: '驟雨', 83: '雨夾雪', 84: '降雪', 85: '降雪',
            90: '酷熱', 91: '寒冷', 92: '熱帶氣旋', 93: '火災危險'
        };
        return map[parseInt(iconNumberStr, 10)] || '多雲';
    }

    /* 將現時天氣圖示代碼，依推算時段是日/夜校正（僅用於推算的未來 6 小時，
       避免例如日間「晴朗」的太陽圖示，被套用到凌晨時段） */
    function nightAdjustedIcon(baseCode, hour) {
        var n = parseInt(baseCode, 10);
        var isNight = (hour >= 19 || hour < 6);
        if (isNight) {
            if (n === 50 || n === 51) return 71;
            if (n === 52 || n === 53 || n === 54) return 76;
        } else {
            if (n >= 70 && n <= 75) return 51;
            if (n === 76 || n === 77) return 53;
        }
        return n;
    }

    function syncNetworkTime() {
        currentNetTimeMs = new Date().getTime(); // 簡化時間獲取，避免卡死
        startInternalClock();
    }

    function startInternalClock() {
        if(timeSyncTimer) clearInterval(timeSyncTimer);
        timeSyncTimer = setInterval(function(){
            currentNetTimeMs += 1000;
            renderClock();
        }, 1000);
        checkPublicHoliday();
        updateKMB();
        updateShuttleBus();
        updateWeather(); 
    }
    
    /* Kindle 裝置本身嘅系統時區設定唔一定係香港（實測見過整部機係 UTC），
       如果淨係用 Date 嘅 local getter（getHours 等），讀出嚟嘅會係裝置時區嘅時間，
       唔一定係香港時間，導致成個 dashboard 時間錯晒。
       呢度刻意加返 +8 小時,然後全部改用 getUTC* 讀取，令顯示時間唔再受裝置時區設定影響，
       保證永遠係正確香港時間。 */
    var HK_OFFSET_MS = 8 * 60 * 60 * 1000;
    function getAccurateHKDate() { return new Date(currentNetTimeMs + HK_OFFSET_MS); }

    function renderClock() {
        if(currentNetTimeMs === 0) return;
        var hkDate = getAccurateHKDate();
        var h = pad(hkDate.getUTCHours());
        var m = pad(hkDate.getUTCMinutes());
        var mon = hkDate.getUTCMonth() + 1;
        var day = hkDate.getUTCDate();
        document.getElementById('local-time').innerText = h + ':' + m;
        document.getElementById('local-date').innerText = day + '/' + mon + ' ' + weekAbbrEN[hkDate.getUTCDay()] + (isPublicHoliday ? ' 紅日' : '');
    }

    function checkPublicHoliday() {
        var hkDate = getAccurateHKDate();
        var y = hkDate.getUTCFullYear();
        var m = pad(hkDate.getUTCMonth() + 1);
        var d = pad(hkDate.getUTCDate());
        var todayStr = String(y) + String(m) + String(d);

        fetchJSON('https://www.1823.gov.hk/common/ical/tc.json', function(err, data) {
            if (!err && data && data.vcalendar && data.vcalendar[0].vevent) {
                var isHoliday = false;
                var events = data.vcalendar[0].vevent;
                for(var i=0; i<events.length; i++) {
                    var e = events[i];
                    if (e.dtstart) {
                        var dt = (Object.prototype.toString.call(e.dtstart) === '[object Array]') ?
                                 (typeof e.dtstart[0] === 'string' ? e.dtstart[0] : e.dtstart[0].value) : e.dtstart;
                        if (dt === todayStr) { isHoliday = true; break; }
                    }
                }
                isPublicHoliday = isHoliday;
            }
            updateShuttleBus();
            renderClock();
        });
    }

    function parseTimeToMins(timeStr) {
        var p = timeStr.split(':');
        return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
    }

    function updateShuttleBus() {
        var hkDate = getAccurateHKDate();
        var currentMins = hkDate.getUTCHours() * 60 + hkDate.getUTCMinutes();
        var dayOfWeek = hkDate.getUTCDay();
        var activeSchedule = (dayOfWeek === 0 || isPublicHoliday) ? shuttleSchedule.sun : (dayOfWeek === 6 ? shuttleSchedule.sat : shuttleSchedule.monFri);
        document.getElementById('shuttle-tag-container').innerHTML = '<span class="bus-tag">' + ((dayOfWeek === 0 || isPublicHoliday) ? "紅日班次" : (dayOfWeek === 6 ? "星期六班次" : "平日班次")) + '</span>';

        var upcoming = [];
        for(var i=0; i<activeSchedule.length; i++) {
            if(parseTimeToMins(activeSchedule[i]) >= currentMins) upcoming.push(activeSchedule[i]);
        }
        var updateTimeStr = pad(hkDate.getUTCHours()) + ':' + pad(hkDate.getUTCMinutes());

        if (upcoming.length > 0) {
            var diffMins = parseTimeToMins(upcoming[0]) - currentMins;
            var html = '<div class="eta-main">' + (diffMins === 0 ? '即將開出' : diffMins + ' 分鐘') + '</div><div class="eta-sub">本班: ' + upcoming[0] + '</div>';
            if (upcoming.length > 1) {
                var nextBuses = [];
                for(var k=1; k<Math.min(3, upcoming.length); k++) nextBuses.push(upcoming[k]);
                html += '<div class="eta-sub eta-sub-small">隨後: ' + nextBuses.join(', ') + '</div>';
            }
            document.getElementById('shuttle-mid').innerHTML = html;
        } else {
            document.getElementById('shuttle-mid').innerHTML = '<div class="eta-main">今日已完結</div>';
        }
        document.getElementById('shuttle-bot').innerHTML = '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
    }

    // 站 ID B069D9C12F89AAFA = 油柑頭 (YAU KOM TAU, TW360)，234B 往荃灣方向
    var KMB_DIRECT_URL = 'https://data.etabus.gov.hk/v1/transport/kmb/eta/B069D9C12F89AAFA/234B/1';
    var KMB_CACHE_URL = 'kmb_eta.json';

    /* 解析 KMB ETA 原始資料，回傳由近到遠嘅分鐘數陣列（outbound 方向）。
       手動拆解 ISO 字串，避開 Kindle 舊版瀏覽器對 Date 解析格式嘅死機 Bug。 */
    function parseKmbEtaMinutes(etaData, hkDate) {
        var etas = [];
        var nowMins = hkDate.getUTCHours() * 60 + hkDate.getUTCMinutes();
        for(var i=0; i<etaData.data.length; i++) {
            var d = etaData.data[i];
            if (d.dir === 'O' && d.eta !== null) {
                var etaStringStr = String(d.eta);
                if(etaStringStr.indexOf('T') !== -1) {
                    var tPart = etaStringStr.split('T')[1].substring(0,5);
                    var etaMins = parseTimeToMins(tPart);
                    var diff = etaMins - nowMins;
                    if(diff < -500) diff += 1440; // 處理跨日
                    if(diff >= 0) etas.push(diff);
                }
            }
        }
        etas.sort(function(a, b){ return a - b; });
        return etas;
    }

    function renderKmbEtas(etas) {
        if (etas.length > 0) {
            var html = '<div class="eta-main">' + (etas[0] === 0 ? '即將抵達' : etas[0] + ' 分鐘') + '</div>';
            if (etas.length > 1) {
                var subEtas = [];
                for(var j=1; j<Math.min(3, etas.length); j++) subEtas.push(etas[j] + '分');
                html += '<div class="eta-sub eta-sub-small">隨後: ' + subEtas.join(', ') + '</div>';
            }
            document.getElementById('kmb-mid').innerHTML = html;
        } else {
            document.getElementById('kmb-mid').innerHTML = '<div class="eta-main">暫無班次</div>';
        }
    }

    /* KMB 直接 call 個 API 喺 Kindle 舊版瀏覽器度經常失敗（相同代碼 call HKO 天氣 API 就正常，
       估計係 CORS 或該 API 對舊版瀏覽器唔穩定）。改為由 GitHub Actions 定時喺伺服器端讀取
       KMB ETA，寫成 kmb_eta.json 存喺同一個 repo／同一個 domain 度，Kindle 只需要讀返
       同源嘅靜態 JSON（同載入呢頁 HTML 完全一樣嘅連線方式，穩陣好多）。
       如果自家快取一時讀唔到（例如 Actions 未跑過／部署緊），先 fallback 試下直接 call KMB。 */
    function updateKMB(isRetry) {
        var hkDate = getAccurateHKDate();
        var updateTimeStr = pad(hkDate.getUTCHours()) + ':' + pad(hkDate.getUTCMinutes());

        function finish() {
            document.getElementById('kmb-bot').innerHTML = '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
        }

        function tryRender(etaData) {
            try {
                if (!etaData || !etaData.data) return false;
                renderKmbEtas(parseKmbEtaMinutes(etaData, hkDate));
                return true;
            } catch (e) {
                return false;
            }
        }

        fetchJSON(KMB_CACHE_URL + '?t=' + Date.now(), function(err, cachedData) {
            if (!err && tryRender(cachedData)) { finish(); return; }

            fetchJSON(KMB_DIRECT_URL, function(err2, directData) {
                if (!err2 && tryRender(directData)) { finish(); return; }

                if (!isRetry) {
                    setTimeout(function() { updateKMB(true); }, 5000);
                    return;
                }
                document.getElementById('kmb-mid').innerHTML = '<div class="eta-main kmb-error">API 異常</div>';
                finish();
            });
        });
    }

    /* 後備做法：天文台冇提供逐小時預報，呢個純粹用「現時狀況」向後推算，
       只喺 Open-Meteo 快取一時攞唔到嘅時候先用，好過個格留空 */
    function renderHeuristicHourlyForecast() {
        if (currentTempC === null || currentIconId === null) return;
        var hkDate = getAccurateHKDate();
        var currentH = hkDate.getUTCHours();

        for(var i=1; i<=6; i++) {
            var forecastH = (currentH + i) % 24;
            var timeLabel = pad(forecastH) + ':00';

            var tempOffset = 0;
            if (forecastH >= 8 && forecastH <= 15) tempOffset = 1;
            else if (forecastH >= 17 && forecastH <= 21) tempOffset = -1;

            var randomShift = Math.floor(Math.random() * 3) - 1;
            var expectedTemp = parseInt(currentTempC, 10) + tempOffset + randomShift;

            var html = '<div class="h-time">' + timeLabel + '</div>';
            html += '<div class="h-icon">' + getSvgIcon(nightAdjustedIcon(currentIconId, forecastH)) + '</div>';
            html += '<div class="h-temp">' + expectedTemp + '<span class="deg"></span></div>';

            var cellId = 'h-' + i;
            var cell = document.getElementById(cellId);
            if(cell) {
                cell.innerHTML = html;
            }
        }
    }

    function hkDateKey(y, m, d, h) { return y * 1000000 + m * 10000 + d * 100 + h; }

    /* 用 GitHub Actions 每 30 分鐘由 Open-Meteo 攞返嚟嘅真正逐小時預報（見
       hourly_forecast.json），揀出「而家之後」嘅 6 個鐘頭渲染。時間字串
       "YYYY-MM-DDTHH:MM" 係香港本地時間（Open-Meteo 已經用 timezone=Asia/Hong_Kong
       輸出，唔係 UTC），手動拆解字串讀年月日時，避開 Date 解析格式喺 Kindle
       舊版瀏覽器嘅風險。回傳 true 代表成功渲染，false 代表冇合用嘅資料。 */
    function renderRealHourlyForecast(hourlyList, hkDate) {
        var nowKey = hkDateKey(hkDate.getUTCFullYear(), hkDate.getUTCMonth() + 1, hkDate.getUTCDate(), hkDate.getUTCHours());

        var upcoming = [];
        for (var i = 0; i < hourlyList.length && upcoming.length < 6; i++) {
            var t = hourlyList[i] && hourlyList[i].time;
            if (!t || t.length < 13) continue;
            var ey = parseInt(t.substring(0, 4), 10);
            var em = parseInt(t.substring(5, 7), 10);
            var ed = parseInt(t.substring(8, 10), 10);
            var eh = parseInt(t.substring(11, 13), 10);
            var key = hkDateKey(ey, em, ed, eh);
            if (key > nowKey) upcoming.push({ entry: hourlyList[i], hour: eh });
        }

        if (upcoming.length === 0) return false;

        for (var j = 0; j < 6; j++) {
            var cell = document.getElementById('h-' + (j + 1));
            if (!cell) continue;
            if (j >= upcoming.length) { cell.innerHTML = ''; continue; }
            var u = upcoming[j];
            var tempRounded = Math.round(u.entry.temp);
            var html = '<div class="h-time">' + pad(u.hour) + ':00</div>';
            html += '<div class="h-icon">' + getWmoSvgIcon(u.entry.code, u.entry.isDay) + '</div>';
            html += '<div class="h-temp">' + tempRounded + '<span class="deg"></span></div>';
            cell.innerHTML = html;
        }
        return true;
    }

    var HOURLY_CACHE_URL = 'hourly_forecast.json';

    function updateHourlyForecast(isRetry) {
        var hkDate = getAccurateHKDate();
        fetchJSON(HOURLY_CACHE_URL + '?t=' + Date.now(), function(err, data) {
            var ok = false;
            try {
                if (!err && data && data.hourly && data.hourly.length) {
                    ok = renderRealHourlyForecast(data.hourly, hkDate);
                }
            } catch (e) { ok = false; }

            if (ok) return;

            if (!isRetry) {
                setTimeout(function() { updateHourlyForecast(true); }, 5000);
                return;
            }
            renderHeuristicHourlyForecast();
        });
    }

    function updateWeather() {
        fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc', function(err, curData) {
            if(!err && curData) {
                if(curData.temperature && curData.temperature.data) {
                    currentTempC = curData.temperature.data[1] ? curData.temperature.data[1].value : curData.temperature.data[0].value;
                }
                currentIconId = curData.icon ? curData.icon[0] : '60';

                var humidity = (curData.humidity && curData.humidity.data && curData.humidity.data[0]) ? curData.humidity.data[0].value : null;

                var html = '<div class="w-icon">' + getSvgIcon(currentIconId) + '</div>';
                html += '<span class="w-temp">' + currentTempC + '<span class="deg"></span>C</span>';
                html += '<div class="w-desc">' + getWeatherDesc(currentIconId) + (humidity !== null ? ' · 濕度 ' + humidity + '%' : '') + '</div>';
                document.getElementById('current-weather').innerHTML = html;

                updateHourlyForecast();
            }
        });

        fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc', function(err, fndData) {
            if(!err && fndData && fndData.weatherForecast) {
                var maxDays = Math.min(4, fndData.weatherForecast.length);
                for(var i=0; i<maxDays; i++) {
                    var day = fndData.weatherForecast[i];
                    var fY = parseInt(day.forecastDate.substring(0,4), 10);
                    var fM = parseInt(day.forecastDate.substring(4,6), 10);
                    var fD = parseInt(day.forecastDate.substring(6,8), 10);
                    var fWeekday = weekAbbrEN[new Date(fY, fM - 1, fD).getDay()];
                    var dateStr = fD + '/' + fM + ' ' + fWeekday;

                    var html = '<div class="f-date">' + dateStr + '</div>';
                    html += '<div class="f-icon">' + getSvgIcon(day.ForecastIcon) + '</div>';
                    html += '<div class="f-temp">' + day.forecastMintemp.value + '<span class="deg"></span>- ' + day.forecastMaxtemp.value + '<span class="deg"></span></div>';
                    html += '<div class="f-rh">' + day.forecastMinrh.value + '%-' + day.forecastMaxrh.value + '%</div>';
                    
                    var cellId = 'f-' + (i+1);
                    var cell = document.getElementById(cellId);
                    if(cell) cell.innerHTML = html;
                }
            }
        });
    }

    window.onload = function() {
        syncNetworkTime();
        setInterval(function() { updateKMB(); updateShuttleBus(); }, 60000);
        setInterval(function() { updateWeather(); }, 900000);
    };

</script>
</body>
</html>
