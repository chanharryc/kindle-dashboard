<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle 資訊面板</title>
    <style>
        /* ===== Web 1.0 究極相容性 CSS (Table 佈局) ===== */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .dashboard {
            width: 100%;
            height: 100%;
            display: table;
            table-layout: fixed; /* 固定寬度，防止內容撐破 */
        }

        /* ===== 行設定 ===== */
        .row {
            display: table-row;
        }

        /* 第一行：時間與現在天氣 (佔高度較小) */
        .row-top { height: 20%; }
        
        /* 第二行：巴士 (佔高度最大) */
        .row-bus { height: 35%; }
        
        /* 第三行：每小時預報 */
        .row-hourly { height: 20%; }
        
        /* 第四行：四日預報 */
        .row-bottom { height: 25%; }


        /* ===== 列與儲存格設定 ===== */
        .cell {
            display: table-cell;
            vertical-align: middle;
            text-align: center;
            border-bottom: 4px solid #000000;
        }

        /* 移除最後一行的下邊框 */
        .row-bottom .cell { border-bottom: none; }

        /* 垂直分隔線 */
        .border-right { border-right: 4px solid #000000; }
        .border-right-dashed { border-right: 2px dashed #000000; }

        /* ===== 內部佈局微調 ===== */
        .bus-container {
            position: relative;
            height: 100%;
        }
        .bus-top { position: absolute; top: 10px; left: 0; width: 100%; text-align: center; }
        .bus-mid { position: absolute; top: 50%; left: 0; width: 100%; -webkit-transform: translateY(-50%); transform: translateY(-50%); text-align: center; }
        .bus-bot { position: absolute; bottom: 10px; left: 0; width: 100%; text-align: center; }


        /* ===== 內部文字與 SVG 排版 ===== */
        .time-main { font-size: 4.5rem; font-weight: bold; line-height: 1; margin-bottom: 5px; }
        .date-main { font-size: 1.2rem; font-weight: bold; }
        
        .w-icon { width: 75px; height: 75px; display: inline-block; }
        .w-temp { font-size: 3rem; font-weight: bold; line-height: 1; display: block;}
        
        .bus-title { font-size: 1.5rem; font-weight: bold; border-bottom: 2px solid #000000; padding-bottom: 2px; margin: 0 15px 5px 15px;}
        .bus-route { font-size: 1rem; font-weight: bold; }
        .bus-tag { display: inline-block; font-size: 0.8rem; border: 1px solid #000000; border-radius: 8px; padding: 1px 6px; margin-top: 3px;}
        .eta-main { font-size: 2.8rem; font-weight: bold; line-height: 1; margin-bottom: 5px; }
        .eta-sub { font-size: 1.1rem; font-weight: bold; line-height: 1.2; }
        .eta-sub-small { font-size: 0.9rem; }
        .eta-update { font-size: 0.8rem; color: #333; }

        .h-time { font-size: 1.1rem; font-weight: bold; margin-bottom: 5px; }
        .h-icon { width: 45px; height: 45px; display: inline-block; }
        .h-temp { font-size: 1.2rem; font-weight: bold; margin-top: 2px; }

        .f-date { font-size: 1.2rem; font-weight: bold; line-height: 1.2; }
        .f-week { font-size: 1rem; font-weight: bold; line-height: 1.2; }
        .f-icon { width: 55px; height: 55px; display: inline-block; margin: 5px 0; }
        .f-temp { font-size: 1.3rem; font-weight: bold; }
        .f-rh { font-size: 1rem; font-weight: bold; margin-top: 2px; }

    </style>
</head>
<body>

<div class="dashboard">

    <!-- 1. 上方：時間與現在天氣 -->
    <div class="row row-top">
        <div class="cell border-right" style="width: 50%;">
            <div class="time-main" id="local-time">--:--</div>
            <div class="date-main" id="local-date">載入中...</div>
        </div>
        <div class="cell" style="width: 50%;" id="current-weather">
            載入天氣中...
        </div>
    </div>

    <!-- 2. 中間：巴士 (使用內部絕對定位來保證三段對齊) -->
    <div class="row row-bus">
        <div class="cell border-right" style="width: 50%; height: 100%;">
            <div class="bus-container">
                <div class="bus-top">
                    <div class="bus-title">九巴 234B</div>
                    <div class="bus-route">油柑頭 ➔ 荃灣西</div>
                </div>
                <div class="bus-mid" id="kmb-mid">載入中...</div>
                <div class="bus-bot" id="kmb-bot"><div class="eta-update">--:--</div></div>
            </div>
        </div>
        
        <div class="cell" style="width: 50%; height: 100%;">
            <div class="bus-container">
                <div class="bus-top">
                    <div class="bus-title">恆麗園村巴</div>
                    <div class="bus-route">往 荃灣</div>
                    <div id="shuttle-tag-container"></div>
                </div>
                <div class="bus-mid" id="shuttle-mid">計算中...</div>
                <div class="bus-bot" id="shuttle-bot"><div class="eta-update">--:--</div></div>
            </div>
        </div>
    </div>

    <!-- 3. 新增：未來數小時推算天氣 -->
    <div class="row row-hourly" id="hourly-container">
        <!-- JS 動態生成 6 個格仔 (為確保安全，這裡先寫死 HTML 結構) -->
        <div class="cell border-right-dashed" id="h-1">載入中...</div>
        <div class="cell border-right-dashed" id="h-2"></div>
        <div class="cell border-right-dashed" id="h-3"></div>
        <div class="cell border-right-dashed" id="h-4"></div>
        <div class="cell border-right-dashed" id="h-5"></div>
        <div class="cell" id="h-6"></div>
    </div>

    <!-- 4. 下方：四日天氣預報 -->
    <div class="row row-bottom" id="forecast-container">
        <div class="cell border-right-dashed" id="f-1">載入預報中...</div>
        <div class="cell border-right-dashed" id="f-2"></div>
        <div class="cell border-right-dashed" id="f-3"></div>
        <div class="cell" id="f-4"></div>
    </div>

</div>

<script>
    // ===== 全局變數 =====
    var isPublicHoliday = false;
    var currentNetTimeMs = 0; 
    var timeSyncTimer = null;
    
    var currentTempC = null;
    var currentIconId = null;

    var shuttleSchedule = {
        monFri: ["06:30", "06:55", "07:10", "07:25", "07:35", "07:50", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "10:00", "10:40", "11:20", "12:00", "12:30", "13:00", "13:40", "14:20", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:50", "20:15", "20:45", "21:15", "21:45", "22:15", "22:45"],
        sat: ["06:30", "06:55", "07:10", "07:25", "07:35", "07:50", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "10:00", "10:20", "10:40", "11:20", "12:00", "12:30", "13:00", "13:40", "14:20", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:50", "20:15", "20:45", "21:15", "21:45", "22:15", "22:45"],
        sun: ["08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:05", "12:40", "13:15", "13:50", "14:25", "15:00", "15:35", "16:10", "16:45", "17:20", "17:55", "18:30", "18:55", "19:20", "19:45", "20:10", "20:35", "21:00"]
    };

    function pad(n) { return n < 10 ? '0' + n : n; }

    function fetchJSON(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try { callback(null, JSON.parse(xhr.responseText)); } 
                    catch (e) { callback(e, null); }
                } else {
                    callback(new Error("Failed"), null);
                }
            }
        };
        xhr.send();
    }

    function getSvgIcon(iconNumberStr) {
        var n = parseInt(iconNumberStr, 10);
        if (n >= 50 && n <= 52) {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg>';
        }
        if (n === 53 || n === 54 || n === 80) {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13v6"></path><path d="M8 13v6"></path><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path></svg>';
        }
        if ((n >= 62 && n <= 64) || (n >= 81 && n <= 85)) {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13v8"></path><path d="M8 13v8"></path><path d="M12 15v8"></path><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path></svg>';
        }
        if (n === 65 || (n >= 70 && n <= 76)) {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"></path><polyline points="13 11 9 17 15 17 11 23"></polyline></svg>';
        }
        return '<svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>';
    }

    // ===== 網路時間 (安全降級版，不用 HEAD 標頭) =====
    // 之前可能因為 Github Pages 阻擋 HEAD 請求而卡死，這次改用更傳統的 Timeout 機制
    function syncNetworkTime() {
        // 直接使用系統時間作為基準，避免複雜的網路請求導致崩潰
        // 因為之前你提到時間其實正常了，代表 Kindle 系統時間大致可用
        // 為了安全，我們退回依賴本機時間的方案，確保畫面能顯示
        currentNetTimeMs = new Date().getTime();
        startInternalClock();
    }

    function startInternalClock() {
        if(timeSyncTimer) clearInterval(timeSyncTimer);
        timeSyncTimer = setInterval(function(){
            currentNetTimeMs += 1000;
            renderClock();
        }, 1000);
        checkPublicHoliday();
        updateKMB();
        updateShuttleBus();
        updateWeather(); 
    }
    
    function getAccurateHKDate() { return new Date(currentNetTimeMs); }

    function renderClock() {
        if(currentNetTimeMs === 0) return;
        var hkDate = getAccurateHKDate();
        var h = pad(hkDate.getHours()); // 降級：使用本機時區
        var m = pad(hkDate.getMinutes());
        var mon = hkDate.getMonth() + 1;
        var day = hkDate.getDate();
        var weekMap = ['日','一','二','三','四','五','六'];
        document.getElementById('local-time').innerText = h + ':' + m;
        document.getElementById('local-date').innerText = mon + '/' + day + ' (' + weekMap[hkDate.getDay()] + ')' + (isPublicHoliday ? ' 紅日' : '');
    }

    // ===== 巴士邏輯 =====
    function checkPublicHoliday() {
        var hkDate = getAccurateHKDate();
        var y = hkDate.getFullYear();
        var m = pad(hkDate.getMonth() + 1);
        var d = pad(hkDate.getDate());
        var todayStr = String(y) + String(m) + String(d);

        fetchJSON('https://www.1823.gov.hk/common/ical/tc.json', function(err, data) {
            if (!err && data && data.vcalendar && data.vcalendar[0].vevent) {
                var isHoliday = false;
                var events = data.vcalendar[0].vevent;
                for(var i=0; i<events.length; i++) {
                    var e = events[i];
                    if (e.dtstart) {
                        var dt = (Object.prototype.toString.call(e.dtstart) === '[object Array]') ?
                                 (typeof e.dtstart[0] === 'string' ? e.dtstart[0] : e.dtstart[0].value) : e.dtstart;
                        if (dt === todayStr) { isHoliday = true; break; }
                    }
                }
                isPublicHoliday = isHoliday;
            }
            updateShuttleBus();
            renderClock();
        });
    }

    function parseTimeToMins(timeStr) {
        var p = timeStr.split(':');
        return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
    }

    function updateShuttleBus() {
        var hkDate = getAccurateHKDate();
        var currentMins = hkDate.getHours() * 60 + hkDate.getMinutes();
        var dayOfWeek = hkDate.getDay(); 
        var activeSchedule = (dayOfWeek === 0 || isPublicHoliday) ? shuttleSchedule.sun : (dayOfWeek === 6 ? shuttleSchedule.sat : shuttleSchedule.monFri);
        document.getElementById('shuttle-tag-container').innerHTML = '<span class="bus-tag">' + ((dayOfWeek === 0 || isPublicHoliday) ? "紅日班次" : (dayOfWeek === 6 ? "星期六班次" : "平日班次")) + '</span>';

        var upcoming = [];
        for(var i=0; i<activeSchedule.length; i++) {
            if(parseTimeToMins(activeSchedule[i]) >= currentMins) upcoming.push(activeSchedule[i]);
        }
        var updateTimeStr = pad(hkDate.getHours()) + ':' + pad(hkDate.getMinutes());

        if (upcoming.length > 0) {
            var diffMins = parseTimeToMins(upcoming[0]) - currentMins;
            var html = '<div class="eta-main">' + (diffMins === 0 ? '即將開出' : diffMins + ' 分鐘') + '</div><div class="eta-sub">本班: ' + upcoming[0] + '</div>';
            if (upcoming.length > 1) {
                var nextBuses = [];
                for(var k=1; k<Math.min(3, upcoming.length); k++) nextBuses.push(upcoming[k]);
                html += '<div class="eta-sub eta-sub-small">隨後: ' + nextBuses.join(', ') + '</div>';
            }
            document.getElementById('shuttle-mid').innerHTML = html;
        } else {
            document.getElementById('shuttle-mid').innerHTML = '<div class="eta-main">今日已完結</div>';
        }
        document.getElementById('shuttle-bot').innerHTML = '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
    }

    function updateKMB() {
        fetchJSON('https://data.etabus.gov.hk/v1/transport/kmb/eta/277DEAAFCFFCD64C/234B/1', function(err, etaData) {
            var hkDate = getAccurateHKDate();
            var updateTimeStr = pad(hkDate.getHours()) + ':' + pad(hkDate.getMinutes());
            if (err || !etaData || !etaData.data) {
                document.getElementById('kmb-mid').innerHTML = '<div class="eta-main">載入失敗</div>';
                document.getElementById('kmb-bot').innerHTML = '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
                return;
            }
            var etas = [];
            for(var i=0; i<etaData.data.length; i++) {
                var d = etaData.data[i];
                if (d.dir === 'O' && d.eta !== null) {
                    var etaStringStr = String(d.eta); 
                    if(etaStringStr.indexOf('T') !== -1) {
                        var diff = parseTimeToMins(etaStringStr.split('T')[1].substring(0,5)) - (hkDate.getHours() * 60 + hkDate.getMinutes());
                        if(diff < -500) diff += 1440; 
                        if(diff >= 0) etas.push(diff);
                    }
                }
            }
            etas.sort(function(a, b){ return a - b; });
            if (etas.length > 0) {
                var html = '<div class="eta-main">' + (etas[0] === 0 ? '即將抵達' : etas[0] + ' 分鐘') + '</div>';
                if (etas.length > 1) {
                    var subEtas = [];
                    for(var j=1; j<Math.min(3, etas.length); j++) subEtas.push(etas[j] + '分');
                    html += '<div class="eta-sub eta-sub-small">隨後: ' + subEtas.join(', ') + '</div>';
                }
                document.getElementById('kmb-mid').innerHTML = html;
            } else { document.getElementById('kmb-mid').innerHTML = '<div class="eta-main">暫無班次</div>'; }
            document.getElementById('kmb-bot').innerHTML = '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
        });
    }

    // ===== 天氣邏輯 (包含每小時預測) =====
    function generateHourlyForecast() {
        if (currentTempC === null || currentIconId === null) return;
        var hkDate = getAccurateHKDate();
        var currentH = hkDate.getHours();
        
        for(var i=1; i<=6; i++) {
            var forecastH = (currentH + i) % 24;
            var timeLabel = pad(forecastH) + ':00';
            
            var tempOffset = 0;
            if (forecastH >= 8 && forecastH <= 15) tempOffset = 1;
            else if (forecastH >= 17 && forecastH <= 21) tempOffset = -1;
            
            var randomShift = Math.floor(Math.random() * 3) - 1; 
            var expectedTemp = parseInt(currentTempC, 10) + tempOffset + randomShift;

            var html = '<div class="h-time">' + timeLabel + '</div>';
            html += '<div class="h-icon">' + getSvgIcon(currentIconId) + '</div>';
            html += '<div class="h-temp">' + expectedTemp + '°</div>';
            
            var cellId = 'h-' + i;
            var cell = document.getElementById(cellId);
            if(cell) cell.innerHTML = html;
        }
    }

    function updateWeather() {
        // 1. 現在天氣
        fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc', function(err, curData) {
            if(!err && curData) {
                if(curData.temperature && curData.temperature.data) {
                    currentTempC = curData.temperature.data[1] ? curData.temperature.data[1].value : curData.temperature.data[0].value;
                }
                currentIconId = curData.icon ? curData.icon[0] : '60';
                
                var html = '<div class="w-icon">' + getSvgIcon(currentIconId) + '</div><br>';
                html += '<span class="w-temp">' + currentTempC + '°C</span>';
                document.getElementById('current-weather').innerHTML = html;

                generateHourlyForecast();
            }
        });

        // 2. 四日天氣預報 (修改為填入寫死的 Table Cell)
        fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc', function(err, fndData) {
            if(!err && fndData && fndData.weatherForecast) {
                var maxDays = Math.min(4, fndData.weatherForecast.length);
                for(var i=0; i<maxDays; i++) {
                    var day = fndData.weatherForecast[i];
                    var dateStr = day.forecastDate.substring(4,6) + '/' + day.forecastDate.substring(6,8);
                    
                    var html = '<div class="f-date">' + dateStr + '</div>';
                    html += '<div class="f-week">(' + day.week + ')</div>';
                    html += '<div class="f-icon">' + getSvgIcon(day.ForecastIcon) + '</div>';
                    html += '<div class="f-temp">' + day.forecastMintemp.value + '°- ' + day.forecastMaxtemp.value + '°</div>';
                    html += '<div class="f-rh">' + day.forecastMinrh.value + '%-' + day.forecastMaxrh.value + '%</div>';
                    
                    var cellId = 'f-' + (i+1);
                    var cell = document.getElementById(cellId);
                    if(cell) cell.innerHTML = html;
                }
            }
        });
    }

    window.onload = function() {
        syncNetworkTime();
        setInterval(function() { updateKMB(); updateShuttleBus(); }, 60000);
        setInterval(function() { updateWeather(); }, 900000);
    };

</script>
</body>
</html>
