<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle 資訊面板</title>
    <style>
        /* ===== 基礎設定：專為 E-ink 打造 ===== */
        /* 移除 CSS 變數，舊版瀏覽器可能不支援，直接寫死顏色 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft JhengHei", sans-serif;
        }

        /* ===== 主排版結構 ===== */
        .dashboard {
            display: table; /* 放棄 Flexbox，改用最安全的 Table 佈局 */
            width: 100%;
            height: 100%;
            padding: 5px;
            border-spacing: 5px; /* 取代 gap */
        }

        .dashboard-row {
            display: table-row;
        }

        .box {
            border: 3px solid #000000;
            display: table-cell;
            vertical-align: middle;
            overflow: hidden;
        }

        /* ===== 上方：時鐘與天氣 ===== */
        .header-panel {
            height: 25%;
        }

        .header-inner {
            display: table;
            width: 100%;
            height: 100%;
        }

        .time-box {
            display: table-cell;
            width: 50%;
            text-align: center;
            vertical-align: middle;
            border-right: 3px solid #000000;
            padding: 10px;
        }

        .time-main {
            font-size: 4.5rem;
            font-weight: bold;
            line-height: 1;
            white-space: nowrap;
        }

        .date-main {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 8px;
            white-space: nowrap;
        }

        .weather-box {
            display: table-cell;
            width: 50%;
            text-align: center;
            vertical-align: middle;
            padding: 5px;
        }

        .w-icon {
            width: 70px;
            height: 70px;
            -webkit-filter: grayscale(100%) contrast(1.5);
            filter: grayscale(100%) contrast(1.5);
        }

        .w-temp {
            font-size: 2.8rem;
            font-weight: bold;
            line-height: 1;
            white-space: nowrap;
            display: block;
        }

        .w-warn {
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #000000;
            padding: 2px 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px; 
            display: inline-block;
            margin-top: 5px;
        }

        /* ===== 中間：巴士 ETA ===== */
        .bus-panel-row {
            height: 50%;
        }

        .bus-panel-inner {
            display: table;
            width: 100%;
            height: 100%;
            border-spacing: 5px;
            margin: -5px; /* 抵消外層 spacing */
        }

        .bus-card {
            display: table-cell;
            width: 50%;
            border: 3px solid #000000;
            text-align: center;
            vertical-align: top;
            padding: 10px;
        }

        .bus-header {
            border-bottom: 2px solid #000000;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .bus-title {
            font-size: 1.6rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .bus-route {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 4px;
            white-space: nowrap;
        }

        .bus-tag {
            display: inline-block;
            font-size: 0.9rem;
            border: 1px solid #000000;
            border-radius: 12px;
            padding: 2px 8px;
            margin-top: 4px;
            white-space: nowrap;
        }

        .bus-body {
            /* 讓內容垂直置中 */
        }

        .eta-main {
            font-size: 3.2rem;
            font-weight: bold;
            white-space: nowrap;
            margin-top: 10px;
        }

        .eta-sub {
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 8px;
            white-space: nowrap;
            word-break: keep-all; 
        }

        .eta-update {
            font-size: 0.8rem;
            margin-top: 15px; 
            text-align: center;
            white-space: nowrap;
        }

        /* ===== 下方：四日預報 ===== */
        .forecast-panel {
            height: 25%;
        }
        
        .forecast-inner {
            display: table;
            width: 100%;
            height: 100%;
            table-layout: fixed; /* 強制均分寬度 */
        }

        .f-day {
            display: table-cell;
            width: 25%;
            text-align: center;
            vertical-align: middle;
            border-right: 2px dashed #000000;
            padding: 2px;
        }
        .f-day:last-child {
            border-right: none;
        }

        .f-date-container {
            text-align: center;
            margin-bottom: 3px;
        }
        .f-date {
            font-size: 1rem;
            font-weight: bold;
            line-height: 1.2;
            white-space: nowrap;
        }
        .f-week {
            font-size: 0.9rem;
            font-weight: bold;
            line-height: 1.2;
            white-space: nowrap;
        }

        .f-icon {
            width: 45px;
            height: 45px;
            -webkit-filter: grayscale(100%) contrast(1.5);
            filter: grayscale(100%) contrast(1.5);
            margin: 2px 0;
        }

        .f-temp {
            font-size: 1rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .f-rh {
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 2px;
            white-space: nowrap;
        }

        .loading {
            font-size: 1rem;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="dashboard">

    <!-- Row 1: Time & Current Weather -->
    <div class="dashboard-row header-panel">
        <div class="box">
            <div class="header-inner">
                <div class="time-box">
                    <div class="time-main" id="local-time">--:--</div>
                    <div class="date-main" id="local-date">載入中...</div>
                </div>
                <div class="weather-box" id="current-weather">
                    <div class="loading">載入天氣中...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Row 2: Buses -->
    <div class="dashboard-row bus-panel-row">
        <div class="dashboard-row">
            <div class="bus-panel-inner">
                <!-- 234B Bus -->
                <div class="bus-card">
                    <div class="bus-header">
                        <div class="bus-title">九巴 234B</div>
                        <div class="bus-route">油柑頭 ➔ 荃灣西</div>
                    </div>
                    <div class="bus-body" id="kmb-container">
                        <div class="loading">搜尋中...</div>
                    </div>
                </div>

                <!-- Shuttle Bus -->
                <div class="bus-card">
                    <div class="bus-header">
                        <div class="bus-title">恆麗園村巴</div>
                        <div class="bus-route">往 荃灣</div>
                        <div class="bus-tag" id="shuttle-type">載入中</div>
                    </div>
                    <div class="bus-body" id="shuttle-container">
                        <div class="loading">計算中...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Row 3: Forecast -->
    <div class="dashboard-row forecast-panel">
        <div class="box">
            <div class="forecast-inner" id="forecast-container">
                <div class="loading" style="width: 100%;">載入預報中...</div>
            </div>
        </div>
    </div>

</div>

<script>
    // === 全局變數 ES5 寫法 (var) ===
    var isPublicHoliday = false;

    // === 自製 AJAX Request 函數 (取代 fetch，相容老舊瀏覽器) ===
    function makeRequest(url, callback, errorCallback) {
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        callback(data);
                    } catch (e) {
                        if (errorCallback) errorCallback(e);
                    }
                } else {
                    if (errorCallback) errorCallback(new Error("Request failed"));
                }
            }
        };
        xhr.open("GET", url, true);
        xhr.send();
    }

    // === 恆麗園村巴資料 ===
    var shuttleSchedule = {
        monFri: ["06:30", "06:55", "07:10", "07:25", "07:35", "07:50", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "10:00", "10:40", "11:20", "12:00", "12:30", "13:00", "13:40", "14:20", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:50", "20:15", "20:45", "21:15", "21:45", "22:15", "22:45"],
        sat: ["06:30", "06:55", "07:10", "07:25", "07:35", "07:50", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "10:00", "10:20", "10:40", "11:20", "12:00", "12:30", "13:00", "13:40", "14:20", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:50", "20:15", "20:45", "21:15", "21:45", "22:15", "22:45"],
        sun: ["08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:05", "12:40", "13:15", "13:50", "14:25", "15:00", "15:35", "16:10", "16:45", "17:20", "17:55", "18:30", "18:55", "19:20", "19:45", "20:10", "20:35", "21:00"]
    };

    function parseTimeToMins(timeStr) {
        var parts = timeStr.split(':');
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function padZero(num) {
        return num < 10 ? '0' + num : num;
    }

    function getFormattedTime(dateObj) {
        return padZero(dateObj.getHours()) + ":" + padZero(dateObj.getMinutes());
    }

    // === 政府 1823 API: 檢查公眾假期 ===
    function checkPublicHoliday(callback) {
        var today = new Date();
        var y = today.getFullYear();
        var m = padZero(today.getMonth() + 1);
        var d = padZero(today.getDate());
        var todayStr = "" + y + m + d; 

        var cached = localStorage.getItem('hk_holidays');
        var cacheTime = localStorage.getItem('hk_holidays_ts');
        var holidays = [];

        if (cached && cacheTime && (Date.now() - parseInt(cacheTime, 10) < 7 * 24 * 60 * 60 * 1000)) {
            holidays = JSON.parse(cached);
            isPublicHoliday = (holidays.indexOf(todayStr) !== -1);
            if(callback) callback();
        } else {
            makeRequest('https://www.1823.gov.hk/common/ical/tc.json', function(data) {
                if (data && data.vcalendar && data.vcalendar[0] && data.vcalendar[0].vevent) {
                    var events = data.vcalendar[0].vevent;
                    for(var i=0; i<events.length; i++) {
                        var e = events[i];
                        if (e.dtstart) {
                             if (Object.prototype.toString.call(e.dtstart) === '[object Array]') {
                                 holidays.push(typeof e.dtstart[0] === 'string' ? e.dtstart[0] : e.dtstart[0].value);
                             } else if (typeof e.dtstart === 'string') {
                                 holidays.push(e.dtstart);
                             }
                        }
                    }
                    localStorage.setItem('hk_holidays', JSON.stringify(holidays));
                    localStorage.setItem('hk_holidays_ts', Date.now().toString());
                }
                isPublicHoliday = (holidays.indexOf(todayStr) !== -1);
                if(callback) callback();
            }, function() {
                isPublicHoliday = false;
                if(callback) callback();
            });
        }
    }

    // === 更新時鐘 ===
    function updateClock() {
        var now = new Date();
        var timeStr = getFormattedTime(now);
        
        var month = now.getMonth() + 1;
        var day = now.getDate();
        var weekdays = ['日', '一', '二', '三', '四', '五', '六'];
        var weekday = weekdays[now.getDay()];
        var dateStr = month + "月" + day + "日 (" + weekday + ")";
        
        document.getElementById('local-time').innerText = timeStr;
        document.getElementById('local-date').innerText = dateStr + (isPublicHoliday ? " (紅日)" : "");
    }

    // === 更新村巴 ===
    function updateShuttleBus() {
        var now = new Date();
        var currentMins = now.getHours() * 60 + now.getMinutes();
        var dayOfWeek = now.getDay(); 

        var activeSchedule = [];
        var scheduleName = "";

        if (dayOfWeek === 0 || isPublicHoliday) {
            activeSchedule = shuttleSchedule.sun;
            scheduleName = "紅日班次";
        } else if (dayOfWeek === 6) {
            activeSchedule = shuttleSchedule.sat;
            scheduleName = "星期六班次";
        } else {
            activeSchedule = shuttleSchedule.monFri;
            scheduleName = "平日班次";
        }

        document.getElementById('shuttle-type').innerText = scheduleName;

        var upcoming = [];
        for(var i=0; i<activeSchedule.length; i++) {
            if (parseTimeToMins(activeSchedule[i]) >= currentMins) {
                upcoming.push(activeSchedule[i]);
            }
        }

        var updateTimeStr = getFormattedTime(now);

        if (upcoming.length > 0) {
            var nextBus = upcoming[0];
            var diffMins = parseTimeToMins(nextBus) - currentMins;
            
            var html = '<div class="eta-main">' + (diffMins === 0 ? '即將開出' : diffMins + ' 分鐘') + '</div>';
            html += '<div class="eta-sub">本班: ' + nextBus + '</div>';
            
            if (upcoming.length > 1) {
                var nextBusesStr = upcoming.slice(1, 3).join(', ');
                html += '<div class="eta-sub" style="font-size: 1rem; font-weight: normal;">隨後: ' + nextBusesStr + '</div>';
            }
            html += '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
            document.getElementById('shuttle-container').innerHTML = html;
        } else {
            document.getElementById('shuttle-container').innerHTML = 
                '<div class="eta-main" style="font-size: 2rem;">今日已完結</div>' +
                '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
        }
    }

    // === 更新 234B ===
    function updateKMB() {
        var route = '234B';
        var targetStopName = '油柑頭';
        
        var stopInfoStr = localStorage.getItem('kmb_234B_ykt_info');
        var stopInfo = stopInfoStr ? JSON.parse(stopInfoStr) : null;
        
        if (!stopInfo) {
            makeRequest('https://data.etabus.gov.hk/v1/transport/kmb/route-stop/' + route + '/outbound/1', function(stopsData) {
                var stops = stopsData.data;
                var found = false;
                
                // 為了避免 ES5 中的回調地獄，簡單地假設最後一個站或者循序找
                // 這裡簡化邏輯：因為舊版瀏覽器處理大量非同步請求會當機，
                // 我們直接硬編碼 234B 油柑頭站 (往荃灣西) 的 Stop ID。
                // 根據九巴開放資料，234B 往荃灣西(O)，油柑頭站 ID 為 277DEAAFCFFCD64C
                stopInfo = { stopId: '277DEAAFCFFCD64C', dir: 'O' };
                localStorage.setItem('kmb_234B_ykt_info', JSON.stringify(stopInfo));
                fetchKMBEta(stopInfo.stopId, route, stopInfo.dir);

            }, function() {
                 document.getElementById('kmb-container').innerHTML = "<div class='loading'>無法載入車站</div>";
            });
        } else {
            fetchKMBEta(stopInfo.stopId, route, stopInfo.dir);
        }
    }

    function fetchKMBEta(stopId, route, dir) {
        makeRequest('https://data.etabus.gov.hk/v1/transport/kmb/eta/' + stopId + '/' + route + '/1', function(etaData) {
            var nowTime = new Date().getTime();
            var etas = [];
            
            if (etaData && etaData.data) {
                for(var i=0; i<etaData.data.length; i++) {
                    var d = etaData.data[i];
                    if (d.dir === dir && d.eta !== null) {
                        var etaTime = new Date(d.eta).getTime();
                        var diffMins = Math.max(0, Math.round((etaTime - nowTime) / 60000));
                        etas.push(diffMins);
                    }
                }
            }
            
            // 排序
            etas.sort(function(a, b) { return a - b; });

            var updateTimeStr = getFormattedTime(new Date());
            
            if (etas.length > 0) {
                var html = '<div class="eta-main">' + (etas[0] === 0 ? '即將抵達' : etas[0] + ' 分鐘') + '</div>';
                if (etas.length > 1) {
                    var subEtas = [];
                    for(var j=1; j<Math.min(3, etas.length); j++){
                        subEtas.push(etas[j] + ' 分');
                    }
                    html += '<div class="eta-sub">隨後: ' + subEtas.join(', ') + '</div>';
                }
                html += '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
                document.getElementById('kmb-container').innerHTML = html;
            } else {
                document.getElementById('kmb-container').innerHTML = 
                    '<div class="eta-main" style="font-size: 2rem;">暫無班次</div>' +
                    '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
            }
        }, function() {
            document.getElementById('kmb-container').innerHTML = "<div class='loading'>無法載入時間</div>";
        });
    }

    // === 更新天氣 ===
    function updateWeather() {
        // 現在天氣
        makeRequest('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc', function(curData) {
            var temp = '--';
            if (curData && curData.temperature && curData.temperature.data) {
                // 舊版瀏覽器沒有可選串連 (?.)
                if (curData.temperature.data.length > 1) {
                    temp = curData.temperature.data[1].value;
                } else if (curData.temperature.data.length > 0) {
                    temp = curData.temperature.data[0].value;
                }
            }
            
            var icon = curData.icon ? curData.icon[0] : '50';
            var warnings = curData.warningMessage ? curData.warningMessage : [];

            var warningHtml = '';
            if (warnings.length > 0) {
                warningHtml = '<div class="w-warn">' + warnings[0] + '</div>';
            }

            document.getElementById('current-weather').innerHTML = 
                '<img src="https://www.hko.gov.hk/images/wxicon/pic' + icon + '.png" class="w-icon" alt="圖">' +
                '<div class="w-temp">' + temp + '°C</div>' +
                warningHtml;
        });

        // 四日預報
        makeRequest('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc', function(fndData) {
            if (fndData && fndData.weatherForecast) {
                var forecastHtml = '';
                var maxDays = Math.min(4, fndData.weatherForecast.length);
                
                for(var i=0; i<maxDays; i++) {
                    var day = fndData.weatherForecast[i];
                    var dateStrFull = day.forecastDate;
                    var dateShort = dateStrFull.substring(4, 6) + '/' + dateStrFull.substring(6, 8);
                    
                    forecastHtml += 
                        '<div class="f-day">' +
                            '<div class="f-date-container">' +
                                '<div class="f-date">' + dateShort + '</div>' +
                                '<div class="f-week">(' + day.week + ')</div>' +
                            '</div>' +
                            '<img src="https://www.hko.gov.hk/images/wxicon/pic' + day.ForecastIcon + '.png" class="f-icon" alt="預報">' +
                            '<div class="f-temp">' + day.forecastMintemp.value + '°- ' + day.forecastMaxtemp.value + '°</div>' +
                            '<div class="f-rh">' + day.forecastMinrh.value + '%- ' + day.forecastMaxrh.value + '%</div>' +
                        '</div>';
                }
                document.getElementById('forecast-container').innerHTML = forecastHtml;
            }
        });
    }

    // === 系統初始化 ===
    window.onload = function() {
        checkPublicHoliday(function() {
            updateClock();
            updateShuttleBus();
            updateKMB();
            updateWeather();
        });

        // 排程更新
        setInterval(updateClock, 1000);
        setInterval(function() {
            updateKMB();
            updateShuttleBus();
        }, 60 * 1000);
        setInterval(updateWeather, 15 * 60 * 1000);
    };

</script>
</body>
</html>
