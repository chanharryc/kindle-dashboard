<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kindle 資訊面板</title>
    <style>
        /* ===== Web 1.0 究極相容性 CSS ===== */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            background-color: #ffffff;
            color: #000000;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        * {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .dashboard {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* ===== 區塊絕對定位切割 ===== */
        .row-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 25%;
            border-bottom: 4px solid #000000;
        }
        
        .box-time {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            border-right: 4px solid #000000;
        }
        
        .box-weather {
            position: absolute;
            top: 0;
            right: 0;
            width: 50%;
            height: 100%;
        }

        .row-mid {
            position: absolute;
            top: 25%;
            left: 0;
            width: 100%;
            height: 50%;
            border-bottom: 4px solid #000000;
        }
        
        .box-bus-kmb, .box-bus-shuttle {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
        }
        .box-bus-kmb {
            left: 0;
            border-right: 4px solid #000000;
        }
        .box-bus-shuttle {
            right: 0;
        }

        .row-bottom {
            position: absolute;
            top: 75%;
            left: 0;
            width: 100%;
            height: 25%;
        }
        
        .f-day {
            position: absolute;
            top: 0;
            height: 100%;
            width: 25%;
            border-right: 2px dashed #000000;
        }
        .f-day-1 { left: 0; }
        .f-day-2 { left: 25%; }
        .f-day-3 { left: 50%; }
        .f-day-4 { left: 75%; border-right: none; }


        /* ===== 內部置中對齊 ===== */
        .center-vertical {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            text-align: center;
        }

        .bus-top {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            text-align: center;
        }
        .bus-mid {
            position: absolute;
            top: 55%; 
            left: 0;
            width: 100%;
            -webkit-transform: translateY(-50%);
            transform: translateY(-50%);
            text-align: center;
        }
        .bus-bot {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            text-align: center;
        }


        /* ===== 內部文字排版 (已放大字體及 SVG 圖示) ===== */
        .time-main { font-size: 4.8rem; font-weight: bold; line-height: 1; margin-bottom: 8px; }
        .date-main { font-size: 1.3rem; font-weight: bold; }
        
        /* 棄用圖片，改用 SVG，設定尺寸及間距 */
        .w-icon { width: 90px; height: 90px; display: inline-block; margin-bottom: 10px; }
        .w-temp { font-size: 3.5rem; font-weight: bold; line-height: 1; display: block;}
        
        .bus-title { font-size: 1.6rem; font-weight: bold; border-bottom: 2px solid #000000; padding-bottom: 4px; margin: 0 15px 5px 15px;}
        .bus-route { font-size: 1.1rem; font-weight: bold; }
        .bus-tag { display: inline-block; font-size: 0.9rem; border: 1px solid #000000; border-radius: 10px; padding: 2px 8px; margin-top: 5px;}
        
        .eta-main { font-size: 3rem; font-weight: bold; line-height: 1.1; margin-bottom: 5px; }
        .eta-sub { font-size: 1.1rem; font-weight: bold; line-height: 1.3; }
        .eta-sub-small { font-size: 0.95rem; }
        .eta-update { font-size: 0.85rem; color: #333; }

        /* 四日預報加大字體 */
        .f-date { font-size: 1.3rem; font-weight: bold; line-height: 1.2; }
        .f-week { font-size: 1.15rem; font-weight: bold; line-height: 1.2; }
        .f-icon { width: 65px; height: 65px; display: inline-block; margin: 10px 0; }
        .f-temp { font-size: 1.4rem; font-weight: bold; }
        .f-rh { font-size: 1.1rem; font-weight: bold; margin-top: 3px; }

    </style>
</head>
<body>

<div class="dashboard">
    <div class="row-top">
        <div class="box-time">
            <div class="center-vertical">
                <div class="time-main" id="local-time">--:--</div>
                <div class="date-main" id="local-date">載入中...</div>
            </div>
        </div>
        <div class="box-weather">
            <div class="center-vertical" id="current-weather">
                載入天氣中...
            </div>
        </div>
    </div>

    <div class="row-mid">
        <div class="box-bus-kmb">
            <div class="bus-top">
                <div class="bus-title">九巴 234B</div>
                <div class="bus-route">油柑頭 ➔ 荃灣西</div>
            </div>
            <div class="bus-mid" id="kmb-mid">
                載入中...
            </div>
            <div class="bus-bot" id="kmb-bot">
                <div class="eta-update">--:--</div>
            </div>
        </div>
        
        <div class="box-bus-shuttle">
            <div class="bus-top">
                <div class="bus-title">恆麗園村巴</div>
                <div class="bus-route">往 荃灣</div>
                <div id="shuttle-tag-container"></div>
            </div>
            <div class="bus-mid" id="shuttle-mid">
                計算中...
            </div>
            <div class="bus-bot" id="shuttle-bot">
                <div class="eta-update">--:--</div>
            </div>
        </div>
    </div>

    <div class="row-bottom" id="forecast-container">
        <!-- JS 將自動填入預報區塊 -->
    </div>
</div>

<script>
    // ===== 全局變數 =====
    var isPublicHoliday = false;
    var currentNetTimeMs = 0; 
    var timeSyncTimer = null;

    // 恆麗園村巴資料
    var shuttleSchedule = {
        monFri: ["06:30", "06:55", "07:10", "07:25", "07:35", "07:50", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "10:00", "10:40", "11:20", "12:00", "12:30", "13:00", "13:40", "14:20", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:50", "20:15", "20:45", "21:15", "21:45", "22:15", "22:45"],
        sat: ["06:30", "06:55", "07:10", "07:25", "07:35", "07:50", "08:00", "08:15", "08:30", "08:45", "09:00", "09:15", "09:30", "10:00", "10:20", "10:40", "11:20", "12:00", "12:30", "13:00", "13:40", "14:20", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "17:45", "18:00", "18:15", "18:30", "18:45", "19:00", "19:15", "19:30", "19:50", "20:15", "20:45", "21:15", "21:45", "22:15", "22:45"],
        sun: ["08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:05", "12:40", "13:15", "13:50", "14:25", "15:00", "15:35", "16:10", "16:45", "17:20", "17:55", "18:30", "18:55", "19:20", "19:45", "20:10", "20:35", "21:00"]
    };

    function pad(n) { return n < 10 ? '0' + n : n; }

    function fetchJSON(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        callback(null, data);
                    } catch (e) { callback(e, null); }
                } else {
                    callback(new Error("Failed"), null);
                }
            }
        };
        xhr.send();
    }

    // ===== 穩定版時間同步機制 =====
    function syncNetworkTime() {
        var xhr = new XMLHttpRequest();
        var url = window.location.href.split('#')[0];
        url += (url.indexOf('?') === -1 ? '?' : '&') + '_=' + new Date().getTime();
        
        var isResolved = false;
        function doFallback() {
            if (isResolved) return;
            isResolved = true;
            fallbackLocalTime();
        }
        setTimeout(doFallback, 3000);

        xhr.open('HEAD', url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4 && !isResolved) {
                var dateStr = xhr.getResponseHeader('Date'); 
                if (dateStr) {
                    isResolved = true;
                    var utcEpoch = new Date(dateStr).getTime();
                    currentNetTimeMs = utcEpoch + (8 * 3600000); 
                    startInternalClock();
                } else {
                    doFallback();
                }
            }
        };
        xhr.onerror = doFallback;
        xhr.send();
    }

    function fallbackLocalTime() {
        if(currentNetTimeMs !== 0) return; 
        var d = new Date();
        currentNetTimeMs = d.getTime() + (d.getTimezoneOffset() * 60000) + (8 * 3600000);
        startInternalClock();
    }

    function startInternalClock() {
        if(timeSyncTimer) clearInterval(timeSyncTimer);
        timeSyncTimer = setInterval(function(){
            currentNetTimeMs += 1000;
            renderClock();
        }, 1000);
        
        checkPublicHoliday();
        updateKMB();
        updateShuttleBus();
        updateWeather();
    }

    function getAccurateHKDate() {
        return new Date(currentNetTimeMs);
    }

    function renderClock() {
        if(currentNetTimeMs === 0) return;
        var hkDate = getAccurateHKDate();
        var h = pad(hkDate.getUTCHours());
        var m = pad(hkDate.getUTCMinutes());
        var mon = hkDate.getUTCMonth() + 1;
        var day = hkDate.getUTCDate();
        var weekMap = ['日','一','二','三','四','五','六'];
        var week = weekMap[hkDate.getUTCDay()];

        document.getElementById('local-time').innerText = h + ':' + m;
        document.getElementById('local-date').innerText = mon + '/' + day + ' (' + week + ')' + (isPublicHoliday ? ' 紅日' : '');
    }

    function checkPublicHoliday() {
        var hkDate = getAccurateHKDate();
        var y = hkDate.getUTCFullYear();
        var m = pad(hkDate.getUTCMonth() + 1);
        var d = pad(hkDate.getUTCDate());
        var todayStr = String(y) + String(m) + String(d);

        fetchJSON('https://www.1823.gov.hk/common/ical/tc.json', function(err, data) {
            if (!err && data && data.vcalendar && data.vcalendar[0].vevent) {
                var isHoliday = false;
                var events = data.vcalendar[0].vevent;
                for(var i=0; i<events.length; i++) {
                    var e = events[i];
                    if (e.dtstart) {
                        var dt = (Object.prototype.toString.call(e.dtstart) === '[object Array]') ?
                                 (typeof e.dtstart[0] === 'string' ? e.dtstart[0] : e.dtstart[0].value) :
                                 e.dtstart;
                        if (dt === todayStr) { isHoliday = true; break; }
                    }
                }
                isPublicHoliday = isHoliday;
            }
            updateShuttleBus();
            renderClock();
        });
    }

    function parseTimeToMins(timeStr) {
        var parts = timeStr.split(':');
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    function updateShuttleBus() {
        var hkDate = getAccurateHKDate();
        var currentMins = hkDate.getUTCHours() * 60 + hkDate.getUTCMinutes();
        var dayOfWeek = hkDate.getUTCDay(); 

        var activeSchedule = [];
        var scheduleName = "";

        if (dayOfWeek === 0 || isPublicHoliday) {
            activeSchedule = shuttleSchedule.sun;
            scheduleName = "紅日班次";
        } else if (dayOfWeek === 6) {
            activeSchedule = shuttleSchedule.sat;
            scheduleName = "星期六班次";
        } else {
            activeSchedule = shuttleSchedule.monFri;
            scheduleName = "平日班次";
        }

        document.getElementById('shuttle-tag-container').innerHTML = '<span class="bus-tag">' + scheduleName + '</span>';

        var upcoming = [];
        for(var i=0; i<activeSchedule.length; i++) {
            if(parseTimeToMins(activeSchedule[i]) >= currentMins) {
                upcoming.push(activeSchedule[i]);
            }
        }
        
        var updateTimeStr = pad(hkDate.getUTCHours()) + ':' + pad(hkDate.getUTCMinutes());

        if (upcoming.length > 0) {
            var nextBus = upcoming[0];
            var diffMins = parseTimeToMins(nextBus) - currentMins;
            var html = '<div class="eta-main">' + (diffMins === 0 ? '即將開出' : diffMins + ' 分鐘') + '</div>';
            html += '<div class="eta-sub">本班: ' + nextBus + '</div>';
            
            if (upcoming.length > 1) {
                var nextBuses = [];
                for(var k=1; k<Math.min(3, upcoming.length); k++) { nextBuses.push(upcoming[k]); }
                html += '<div class="eta-sub eta-sub-small">隨後: ' + nextBuses.join(', ') + '</div>';
            }
            document.getElementById('shuttle-mid').innerHTML = html;
        } else {
            document.getElementById('shuttle-mid').innerHTML = '<div class="eta-main" style="margin-top: 20px;">今日已完結</div>';
        }
        document.getElementById('shuttle-bot').innerHTML = '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
    }

    function updateKMB() {
        var route = '234B';
        var stopId = '277DEAAFCFFCD64C'; 
        var dir = 'O'; 

        fetchJSON('https://data.etabus.gov.hk/v1/transport/kmb/eta/' + stopId + '/' + route + '/1', function(err, etaData) {
            var hkDate = getAccurateHKDate();
            var updateTimeStr = pad(hkDate.getUTCHours()) + ':' + pad(hkDate.getUTCMinutes());

            if (err || !etaData || !etaData.data) {
                document.getElementById('kmb-mid').innerHTML = '<div class="eta-main">載入失敗</div>';
                document.getElementById('kmb-bot').innerHTML = '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
                return;
            }
            
            var etas = [];
            for(var i=0; i<etaData.data.length; i++) {
                var d = etaData.data[i];
                if (d.dir === dir && d.eta !== null) {
                    var etaStringStr = String(d.eta); 
                    if(etaStringStr.indexOf('T') !== -1) {
                        var tPart = etaStringStr.split('T')[1].substring(0,5); 
                        var etaMins = parseTimeToMins(tPart);
                        var nowMins = hkDate.getUTCHours() * 60 + hkDate.getUTCMinutes();
                        var diff = etaMins - nowMins;
                        if(diff < -500) diff += 1440; 
                        if(diff >= 0) etas.push(diff);
                    }
                }
            }
            etas.sort(function(a, b){ return a - b; });
            
            if (etas.length > 0) {
                var html = '<div class="eta-main">' + (etas[0] === 0 ? '即將抵達' : etas[0] + ' 分鐘') + '</div>';
                if (etas.length > 1) {
                    var subEtas = [];
                    for(var j=1; j<Math.min(3, etas.length); j++) { subEtas.push(etas[j] + '分'); }
                    html += '<div class="eta-sub eta-sub-small">隨後: ' + subEtas.join(', ') + '</div>';
                }
                document.getElementById('kmb-mid').innerHTML = html;
            } else {
                document.getElementById('kmb-mid').innerHTML = '<div class="eta-main" style="margin-top: 20px;">暫無班次</div>';
            }
            document.getElementById('kmb-bot').innerHTML = '<div class="eta-update">更新: ' + updateTimeStr + '</div>';
        });
    }

    // ===== 全新 E-ink 專用高對比 SVG 圖示生成器 =====
    function getSvgIcon(iconNumberStr) {
        var n = parseInt(iconNumberStr, 10);
        // 天晴 (50, 51)
        if (n === 50 || n === 51) {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>';
        }
        // 下雨 (53, 54, 62, 63, 64, 80-85)
        if ((n >= 53 && n <= 54) || (n >= 62 && n <= 64) || (n >= 80 && n <= 85)) {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 13v8"></path><path d="M8 13v8"></path><path d="M12 15v8"></path><path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path></svg>';
        }
        // 雷暴 (65, 70-76)
        if (n === 65 || (n >= 70 && n <= 76)) {
            return '<svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"></path><polyline points="13 11 9 17 15 17 11 23"></polyline></svg>';
        }
        // 預設: 多雲/陰天 (52, 60, 61, 其他)
        return '<svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>';
    }

    function updateWeather() {
        fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc', function(err, curData) {
            if(!err && curData) {
                var temp = '--';
                if(curData.temperature && curData.temperature.data) {
                    temp = curData.temperature.data[1] ? curData.temperature.data[1].value : curData.temperature.data[0].value;
                }
                var iconNum = curData.icon ? curData.icon[0] : '60';
                
                // 改用 SVG 繪製
                var html = '<div class="w-icon">' + getSvgIcon(iconNum) + '</div><br>';
                html += '<span class="w-temp">' + temp + '°C</span>';
                document.getElementById('current-weather').innerHTML = html;
            }
        });

        fetchJSON('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc', function(err, fndData) {
            if(!err && fndData && fndData.weatherForecast) {
                var html = '';
                var maxDays = Math.min(4, fndData.weatherForecast.length);
                for(var i=0; i<maxDays; i++) {
                    var day = fndData.weatherForecast[i];
                    var dateStr = day.forecastDate.substring(4,6) + '/' + day.forecastDate.substring(6,8);
                    
                    html += '<div class="f-day f-day-' + (i+1) + '">';
                    html += '<div class="center-vertical">';
                    html += '<div class="f-date">' + dateStr + '</div>';
                    html += '<div class="f-week">(' + day.week + ')</div>';
                    
                    // 底部預報同樣改用 SVG 繪製
                    html += '<div class="f-icon">' + getSvgIcon(day.ForecastIcon) + '</div>';
                    
                    html += '<div class="f-temp">' + day.forecastMintemp.value + '°- ' + day.forecastMaxtemp.value + '°</div>';
                    html += '<div class="f-rh">' + day.forecastMinrh.value + '%-' + day.forecastMaxrh.value + '%</div>';
                    html += '</div></div>';
                }
                document.getElementById('forecast-container').innerHTML = html;
            }
        });
    }

    window.onload = function() {
        syncNetworkTime();
        setInterval(function() { updateKMB(); updateShuttleBus(); }, 60000);
        setInterval(function() { updateWeather(); }, 900000);
        setInterval(function() { syncNetworkTime(); }, 3600000);
    };

</script>
</body>
</html>
