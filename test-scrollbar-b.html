<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>測試 B</title>
<style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden !important;
        background-color: #ffffff;
        color: #000000;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .box { padding: 16px; }
    .title { font-size: 1.6rem; font-weight: bold; border-bottom: 3px solid #000; padding-bottom: 8px; margin-bottom: 12px; }
    .line { font-size: 1.2rem; font-weight: bold; padding: 6px 0; }
</style>
</head>
<body>
<div class="box">
    <div class="title">測試 B：內容只得 1 行，完全裝得落畫面</div>
    <div class="line">得呢一行字，冇溢出</div>
</div>
</body>
</html>
