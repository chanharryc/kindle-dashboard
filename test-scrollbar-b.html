<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>測試 B</title>
<style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden !important;
        background-color: #ffffff;
        color: #000000;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar {
        width: 0 !important;
        height: 0 !important;
        display: none !important;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .box { padding: 16px; }
    .title { font-size: 1.6rem; font-weight: bold; border-bottom: 3px solid #000; padding-bottom: 8px; margin-bottom: 12px; }
    .line { font-size: 1.2rem; font-weight: bold; padding: 10px 0; border-bottom: 1px dashed #000; }
    .marker { font-size: 1.4rem; font-weight: bold; padding: 20px 0; text-align: center; border: 3px solid #000; margin-top: 10px; }
    .spacer { height: 3000px; background: repeating-linear-gradient(0deg, #000 0 2px, #fff 2px 40px); }
</style>
</head>
<body>
<div class="box">
    <div class="title">測試 B：加咗隱藏捲軸 CSS（同主頁面而家一樣）</div>
    <div class="line">呢頁刻意整到內容大幅高過畫面（同測試 A 一樣加咗 3000px 色塊）</div>
    <div class="line">加咗 ::-webkit-scrollbar{display:none} 等 CSS</div>
    <div class="spacer"></div>
    <div class="marker">如果你見到呢個框，代表個頁面捲動咗</div>
</div>
</body>
</html>
